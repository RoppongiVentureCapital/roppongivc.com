baseURL = "https://www.roppongivc.com/"
title = "六本木ベンチャーキャピタル"
defaultContentLanguage = "ja"
enableRobotsTXT = true
paginate = 12

[languages]
  [languages.ja]
    languageName = "JP"
    weight = 1
    title = "六本木ベンチャーキャピタル"
    [languages.ja.params]
      description = "六本木ベンチャーキャピタルは、突出した能力を持つ中学生・高校生・大学生が、AIを活用して、まだ世にない新しいものを生み出すプログラム「Agora」と「Edge」を運営する団体です。"
    [[languages.ja.menus.main]]
      name = "Agora"
      url = "/agora/"
      weight = 1
    # ★2026-09-10 Challenge を上のバーから外し、AI Lab を Agora の次に入れた（山田様のご承認・9/09）。
    #   ★Challenge は消えていない ── トップの「あなたの思考と能力を試す」節と /challenges/ は生きている。
    #   ★AI Lab の行き先は static/deep-black-box/（Hugoのページではないので言語の切替はない）。
    [[languages.ja.menus.main]]
      name = "AI Lab"
      url = "/deep-black-box/"
      weight = 2
    [[languages.ja.menus.main]]
      name = "Edge"
      url = "/edge/"
      weight = 3
    [[languages.ja.menus.main]]
      name = "Media"
      url = "/jiwa/"
      weight = 4
    [[languages.ja.menus.main]]
      name = "Members"
      url = "/members/"
      weight = 5
  [languages.en]
    languageName = "EN"
    weight = 2
    title = "Roppongi Venture Capital"
    [languages.en.params]
      description = "World-class entrepreneurial experiences for Japan's brightest STEM minds."
    [[languages.en.menus.main]]
      name = "Agora"
      url = "/en/agora/"
      weight = 1
    # ★2026-09-10 日本語と同じ構成に揃えた。
    # 🔴🔴🔴🔴 2026-09-12 記録担当：★★★★行き先を /deep-black-box/ から /en/deep-black-box/ に変えた
    #   （山田様のご判断 2026-09-12「A案」）。
    #   ★理由 ── ★英語ページの他のリンク（記事のStart・英語トップ・Agoraページ・JIWA・404）を
    #     すべて /en/ に揃えたので、★ナビだけが日本語のゲームへ飛ぶのは一貫しない。
    #     ★★「英語圏の人が日本語の画面に落ちる」より「英語で遊べて続きは準備中」のほうが伝わる。
    #   ⚠️★2026-09-12 時点で英語版ゲームは【23枚のうち6枚】（index・q01〜q06）で noindex。
    #     ★q07 以降は404。★別セッションが作成中で、★完成すればこの1行は直す必要がない。
    [[languages.en.menus.main]]
      name = "AI Lab"
      url = "/en/deep-black-box/"
      weight = 2
    [[languages.en.menus.main]]
      name = "Edge"
      url = "/en/edge/"
      weight = 3
    [[languages.en.menus.main]]
      name = "Media"
      url = "/en/jiwa/"
      weight = 4
    [[languages.en.menus.main]]
      name = "Members"
      url = "/en/members/"
      weight = 5

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      table = true
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"
  pillar = "pillars"
