<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI開発会社の社長になる ── 5,000億円と5年</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<!-- ══════════════════════════════════════════════════════════════════════════
     index.html ── 入口の1枚（★文面役の持ち物）
     ──────────────────────────────────────────────────────────────────────────
     ★★出どころ：★★序章を intro.html に出した回に、★★入口が消えた
       （★それまでは ch1.html が序章から始まっていたので、★そこが入口だった）。
       ★★レビュー役が現物で数えて「index.html が存在しない」と出した1件。★2026-08-21
     ──────────────────────────────────────────────────────────────────────────
     ★★この画面が持つのは【遷移だけ】である（★★レビュー役の条件）
       ✗ ★★新しい機構を足さない：★保存の読み出し・進行の判定・乱数・fetch は1つも無い
       ✗ ★★数値を持たない（★`ch*.data.js` を1本も読み込んでいない）
       ✗ ★★新しい主張を足さない：★★下の字は【序章の1ページ目と2ページ目からの写し】である
         ★★写した先  ★intro.html の INTRO[0]「あなたは AI開発会社の社長です」／
           ★INTRO[1]「5,000億円と5年。AIを1体つくって、世界と競争します」と
           ★「画面の数字は…論文32本から取りました」の断り
     ★★`file://` で開いても動く（→01 §9・§10）。★★読み込むのは ui.css と fig.js と ch_common.js だけ
     ──────────────────────────────────────────────────────────────────────────
     ★★どこへ送るか（★★03 が決めた）
       ★★既定は【序章】である（★`intro.html`）。★理由：★★決定10 で序章と第1章を分けたので、
         ★★はじめて遊ぶ人にとっての1ページ目は序章の1ページ目である（★決定5＝秘書の全身が出る画面）
       ★★あわせて【第1章へ直に入る口】も置く。★理由：★★序章は10ページある。
         ★★2回目に遊ぶ人が毎回10ページを通ることになると、★序章を分けた利点が消える
       ★★「続きから」は置かない。★★理由：★★保存を読むのは【新しい機構】である（★上の条件）
     ══════════════════════════════════════════════════════════════════════════ -->
<div id="fit"><div id="frame">

<div id="office"></div>
<img id="bgimg" src="assets/bg_office.png" alt="" onerror="this.remove()">

<div id="grade"></div>
<!-- 秘書の全身立ち絵（任意）。無ければ自分を消す -->
<img id="whole" src="assets/secretary_full.png" alt="" onerror="this.remove()">

<div class="topbar">
 <div class="logo ol"><span>AI&nbsp;LAB</span></div>
 <div class="when ol">
  <span class="yr">はじめに</span>
  <span class="qq">／ 5年のうち</span>
 </div>
 <div class="rival">
  <span class="k ol">他社の力</span>
  <span class="rbar" title="他社のAIの力。自社の満点に対する割合"><i id="rv" style="width:50%"></i></span>

 </div>
 <div class="cash">
  <span class="y ol">&yen;</span><span class="v ol2" id="cash">5,000</span><span class="u ol">億円</span>
 </div>
</div>

<div class="stage">

</div>

<div class="info">

 <div class="in">
  <div class="bust">
   <div class="ph"><div class="h"></div></div>
   <img src="assets/secretary_bust.png" alt="" onerror="this.remove()">
  </div>
  <div class="said" id="said"></div>
 </div>
</div>

<div class="veil" id="veil"><div class="dlg" id="dlg"></div></div>

</div></div><!-- /#frame /#fit -->

<script src="fig.js"></script>
<script src="ch_common.js"></script>
<script>
/* ══════════ 入口の字（★序章からの写し。★新しい主張を足していない）══════════ */
const PANE=`
 <div class="pt"><h2 class="ol">AI開発会社の社長になる</h2><div class="tag">
  <span><span class="k ol">5,000億円</span> <span class="v c n ol">5</span>
   <span class="k ol">年</span></span>
 </div></div>
 <div class="pc">
  <div class="ibody">
   今日から、あなたは <b>AI開発会社の社長</b>です。<br>
   何を作るか、お金を何に使うかを、全部あなたが決めます。<br><br>
   <b class="em">5,000億円と5年。AIを1体つくって、世界と競争します。</b><br>
   <span class="sm">AIは1体だけです。作り直せません。1年 ＝ 1章で、全部で5章あります。</span><br><br>
   <span class="sm">画面の数字は、書籍『原論文から解き明かす生成AI』（菊田遥平／技術評論社）が
   扱う論文32本から取りました。<br>
   　 論文名と節番号が付いているので、気になったら自分で原文に当たれます。</span>
  </div>
  <div class="row">
   <button class="btn go" onclick="location.href='intro.html'">はじめる</button>
   <button class="btn" onclick="location.href='ch1.html'">説明をとばして第1章へ</button>
  </div>
 </div>`;

/* ══════════ 左メニュー（★遷移だけ。★選択肢を持たない）══════════ */
const MENU=`
 <div class="grpL ol">はじめに</div>
 <div class="mi sel"><div class="t">AI開発会社の社長になる</div>
  <div class="sub">5,000億円と5年</div></div>
 <div class="grpL ol">本編</div>
 <div class="mi fin" data-go="intro.html"><div class="t ol">はじめる</div>
  <div class="sub ol">序章 ── 麻衣の説明</div></div>
 <div class="mi" data-go="ch1.html"><div class="t ol">説明をとばして第1章へ</div>
  <div class="sub ol">AIを1体つくる</div></div>
 <div class="grpL ol">説明</div>
 <div class="mi" data-go="doc.html"><div class="t ol">資料を開く</div>
  <div class="sub ol">AIの原理 ／ 原論文32本</div></div>`;

C.boot(()=>{});
/* ★秘書の全身を出す（★入口は序章の手前なので、★序章の1ページ目と同じ扱いにした）
   ★出す指定は ui.css の `html.firstpage #whole`（★既定は display:none） */
document.documentElement.classList.add('intro','firstpage');
document.getElementById('pane').innerHTML=PANE;
document.getElementById('menu').innerHTML=MENU;
document.querySelectorAll('.mi[data-go]').forEach(el=>
 el.onclick=()=>{location.href=el.dataset.go});
document.getElementById('said').innerHTML=
 '<span class="lbl">AI秘書・鳥居 麻衣</span><br>'
 +'おはようございます。<br>'
 +'はじめての方は <span class="hl">「はじめる」</span> を押してください。'
 +'序章で、これから作るものをご説明します。';
</script>
</body>
</html>
