 mai:'印は<span class="hl">その数や文がどこから来たか</span>を言っています。ここに7種類ぜんぶ並べました。',
 land:['<b>【実測】</b>は論文が測った数、<b>【設定】</b>はこのゲームが置いた数です。ここが一番よく混ざります。',
  '<b>【算術】</b>は、論文の数から計算して出した数です。論文にその数字は載っていません。',
  '<b>〔原典〕〔資料〕〔導出〕〔教科書〕</b>の4つは、文がどこから来たかの印です。'],
 b:`<p>ゲームの画面に出る数字と文には、<b>出どころの印</b>が付いています。
  <b>7種類あります。</b>意味は下のとおりです。</p>
 <div class="fml">印　　　　　　意味　　　　　　　　　　　　　　　　　　　このゲームの中の実物<br>
  <em>【実測】</em>　　　論文が測った数である　　　　　　　　　　評価者 約40名／一致率 72.6%／周回数 3.4回<br>
  <em>【設定】</em>　　　このゲームが置いた数である　　　　　　　1名 年1億円／上限40名／5本のバーの目盛り<br>
  <em>【算術】</em>　　　論文の数から計算して出した数である　　　340億語（19＋12＋3）／約10倍（7.4÷0.7）<br>
  〔原典〕　　　論文にそう書いてある　　　　　　　　　　「多少の過学習を受け入れて質を買う」<br>
  〔資料〕　　　この資料が論文をまとめた分である　　　　「質の高いものは2〜3周」（丸めが入る）<br>
  〔導出〕　　　論文の話から引き出した使い方である　　　「検算できる仕事はAIに任せる」<br>
  〔教科書〕　　分野の教科書に載っている一般の話である　過学習の定義／softmax の定義</div>
 <div class="k how"><span class="kh">★ 【実測】と【設定】をなぜ分けるか</span>
  <b>この2つが混ざると、論文が言っていないことを論文のせいにできてしまいます。</b><br>
  たとえば「評価者は約40名だった」は<b>論文が書いている数</b>です（【実測】）。
  一方「1名につき年1億円」は<b>このゲームが遊べるように置いた数</b>で、
  <b>論文に金額は1円も出てきません</b>（【設定】）。<br>
  → だから<b>【設定】が付いている数は、現実の話として持ち出さないでください。</b>
  逆に<b>【実測】が付いている数は、論文を開けば確かめられます</b>（出どころは各節の下に書いてあります）。</div>
 <div class="k fix"><span class="kh">★ 【算術】は【実測】ではありません</span>
  <b>論文の表から足し算・割り算をして出した数</b>には【算術】が付きます。
  たとえば「厳選した側は340億語」は、<b>論文の表の 19＋12＋3 を足した数</b>です。
  <b>論文にその340という数字は載っていません。</b><br>
  → 引用するときは「論文の表から計算すると340億語」と書いてください。
  <b>「論文に340億語と書いてある」は誤りになります。</b></div>
 <div class="k str"><span class="kh">★ 〔導出〕は、このゲームが引き受けている責任です</span>
  <b>「あなたが今日から使えること」の欄</b>に付く印です。
  論文はそこまで書いていないので、<b>踏み外していたらこのゲームの責任です。</b><br>
  だから<b>そのすぐ下に必ず出典が並んでいます</b>。元の論文が何を言っているかを見比べられる形にしてあります。</div>
 <p class="src"><b>出典</b>　この節はこのゲームの決めごとです（論文ではありません）。
  だから出典がありません。印の付け方そのものが、このゲームの約束です</p>`},

{id:'p1-1-function',grp:'第1部 基礎編',t:'AIは「巨大な関数」を作る行為',short:'巨大な関数',

 <h4>規模の実感</h4>
 <p>GPT-3（1750億パラメータ）の学習には <b>3,640 petaflop/s-day</b>（＝3.14×10²³ 演算）が投じられました。
  一方で同じ節は「学習後は驚くほど効率的で、<b>100ページ分の文章を生成するコストは約0.4 kW-h＝数セント</b>」と

 <p class="src"><b>出典</b>　Kaplan et al. 2020「Scaling Laws for Neural Language Models」
  arXiv:2001.08361 Appendix C ／ Brown et al. 2020「Language Models are Few-Shot Learners」

{id:'p1-2-class-reg',grp:'第1部 基礎編',t:'関数で「分ける」と「当てる」',short:'分類と回帰',

 b:`<p><span class="cf b">○</span>分類は「どれか」を分けます（入力→猫90%／犬10%）。回帰は「数値」を当てます（入力→23.5度）。</p>
 <ul>
  <li><b>分類</b>：画像認識も分類です。入力が「画素の数値が数百万個並んだもの」になるだけです。</li>
  <li><b>回帰</b>：数値そのものを出すので、確率の一覧は出ません。</li>
  <li><b>LLM の「次の単語当て」は、選択肢が数万個ある超巨大な分類です。</b>
   だから出力が「東京 82% / 大阪 11% / …」という確率の一覧になります。</li>
 </ul>
 <div class="k how"><span class="kh">★ 落とすと誤解が残る補足</span>

  逆に言えば、<b>LLMを理解するために必要な機械学習は「勾配降下で学習する関数」だけ</b>です。</div>
 <div class="k res"><span class="kh">★ ◎ にしていない理由（この資料が明記）</span>
  <b>クラスタリングや強化学習を含めていない簡略化</b>であり、
  「LLMを説明するために必要な範囲では2種類」という限定つきです。
  ＊この資料の自己点検で ◎ から ○ に格下げされた項目です。</div>
 <p class="src"><b>出典</b>　なし（教科書レベルの一般的な説明。この資料の第1部は原論文まで遡っていないと明記）</p>`},

{id:'p1-3-learning',grp:'第1部 基礎編',t:'「学習」の正体 ── 誤差を測って、減る方へ少しずつ直す',short:'学習の正体',
 sec:'3',part:'第1部',gname:'基礎',cf:'◎',
 mai:'ここで一つだけ罠があります。<span class="ng">「誤差＝2乗和」は回帰の話です。</span>LLM の損失はクロスエントロピーです。',
 land:['適当なパラメータで始め、データとのずれを測り、減る方へ数字を少しずつ変える。これを何十億回くり返します。',
  'どちらへ回せば減るかを試さずに教えてくれるのが<b>微分</b>です。',
  '<b>LLM の損失は2乗和ではなくクロスエントロピー（正解に与えた確率の対数）です。</b>'],
 b:`<p><span class="cf a">◎</span>手順は3段です。①適当なパラメータで関数を引く。②データとのずれ（誤差）を測る。
  ③パラメータの数字を少しずつ変えて測り直し、減る方へまた変える。これを何十億回くり返します。</p>
 <p>パラメータが数千億個あると、「どのパラメータの数字をどちらへ変えれば誤差が減るか」を1個ずつ試す時間はありません。
  試さずに教えてくれるのが<b>微分</b>です。</p>
 <div class="k fix"><span class="kh">★ 通説の訂正</span>
  「誤差＝ずれを2乗して全部足す」は<b>回帰の話</b>です。<b>LLM の損失はそれではありません。</b>
  LLM は分類なので、<b>正解に与えた確率の対数</b>を使います（クロスエントロピー）。</div>
 <div class="fml">L = − Σ<em>t</em> log p<em>θ</em>( x<em>t</em> | x<em>&lt;t</em> )<br>
  例：p(東京) = 0.82 → 損失 −log(0.82) = 0.20　（よく当てた）<br>
  　　p(東京) = 0.05 → 損失 −log(0.05) = 3.00　（外した）<br>
  ＊log は自然対数、単位は nats。bits で言うなら log₂ をとって 0.286 / 4.32</div>
 <div class="k str"><span class="kh">★ 原典に式がある</span>
  この式は原論文にあります（GPT-1 Eq.1 ／ GPT-2 Eq.1）。
  <b>回帰なら2乗和、分類ならクロスエントロピー。</b>混ぜないでください。
  「誤差＝2乗和」と言い切ると、LLM の損失に繋がらなくなります。</div>
 <p class="src"><b>出典</b>　Radford et al. 2018「Improving Language Understanding by Generative
  Pre-Training」Eq.1 ／ Radford et al. 2019「Language Models are Unsupervised Multitask Learners」Eq.1
  ／ 手順そのものは教科書レベルの一般的な説明（典拠なし）</p>`},

{id:'p1-4-toolbox',grp:'第1部 基礎編',t:'数学の道具箱 ── 何が必要で、何が要らないか',short:'数学の道具箱',
 sec:'4',part:'第1部',gname:'基礎',cf:'○',
 mai:'よく見る「5つで足りる」という整理は<span class="ng">足りません。</span>KL・エントロピー・期待値が落ちています。',
 land:['必要な道具は4つ：<b>微分・線形代数・確率（softmax）・情報量</b>。',
  '情報量では <b>クロスエントロピー ＝ エントロピー ＋ KL</b> の分解を省略しないでください。',
  '<b>「関数・損失・勾配降下・線形代数・softmax の5つで足りる」は足りません。</b>'],
 b:`<p><span class="cf b">○</span>第2部を読むために必要な道具は4つです。</p>
 <p><b>(1) 微分</b> ── いまいる場所の坂の傾き。傾きが分かれば、パラメータの数字を変える方向が決まります（勾配降下）。
  ＊誤差逆伝播法の原典は Rumelhart, Hinton &amp; Williams 1986 (Nature) です。歴史として一行触れるだけで十分です。</p>
 <p><b>(2) 線形代数</b> ── ベクトル＝数の並び、行列を掛ける＝変換。
  「1個ずつ」ではなく「表ごと一気に」計算できるので、パラメータが数千億個でも動きます。</p>
 <p><b>(3) 確率</b> ── softmax でスコアを合計1の確率に直します。
  ＊起源はボルツマン分布、"softmax" の命名は Bridle 1990。引く必要はありません。</p>
 <p><b>(4) 情報量</b> ── エントロピー＝「予測の難しさ」、KLダイバージェンス＝「2つの分布のずれ」。
  <b>そして クロスエントロピー ＝ エントロピー ＋ KL という分解。</b>ここは省略しないでください。
  スケーリング則で、損失が「これ以上下げられない部分」と「まだ下げられる部分」に分かれる話が、
  この分解そのものだからです。</p>
 <div class="k fix"><span class="kh">★ 通説の訂正</span>
  <b>よくある「関数・損失・勾配降下・線形代数・softmax の5つで足りる」という整理は、足りません。</b>
  <b>KLダイバージェンス・エントロピー・期待値</b>が落ちています。
  KL は第2部で扱う3つの目的関数（RLHF・RLVR・拡散モデル）のすべてに出てきます。
  エントロピーは、スケーリング則とトークナイズ理論の主結果に出てきます。</div>
 <div class="k res"><span class="kh">★ ◎ にしていない理由（この資料が明記）</span>
  「これだけ知っていれば読める」という<b>必要十分の判断</b>であって、原典に明記のある事実ではありません。
  実際、初版の整理では KL・エントロピー・期待値が落ちていました。</div>
 <p class="src"><b>出典</b>　なし（教科書レベルの一般的な説明）。
  歴史の言及のみ：Rumelhart, Hinton &amp; Williams 1986 (Nature) ／ Bridle 1990</p>`},

/* ══════════════ 貼る位置 ⑤　第1部 基礎編 5（前半） ══════════════ */
{id:'p1-5-king-man',grp:'第1部 基礎編',t:'「王様 − 男 ＋ 女 ≒ 女王」の正確な扱い',short:'王様−男＋女',
 sec:'5',part:'第1部',gname:'基礎',cf:'○',
 mai:'この例はたいてい ◎ として出回っていますが、<span class="ng">正しくは ○ です。</span>基礎ほど誤りやすい、という実例です。',
 land:['単語ベクトルには「意味の差が矢印として取り出せる」性質が<b>部分的に</b>あります。',
  'word2vec（Skip-gram, 2013）の測定で、<b>意味的な類推の正答率は約55%</b>。約半分しか当たりません。',
  '<b>これは word2vec という専用モデルの性質で、LLM の内部表現で同じ演算が成り立つかは別問題です。</b>'],
 b:`<p>コンピュータは文字を直接扱えません。入口の作業は2つです。<b>区切る（トークナイズ）</b>と
  <b>数値にする（埋め込み）</b>。各トークンを数百〜数千次元のベクトルに対応させます。</p>
 <p>よく見る説明は「女王←王様」「女←男」の2本の矢印が同じ向き・同じ長さだから
  王様 − 男 ＋ 女 ≒ 女王 になる、というものです。<b>これはたいてい ◎ として提示されますが、
  <span class="cf b">○</span>です。</b>理由が3つあります。</p>
 <h4>(1) 精度は「だいたい半分」です</h4>
 <p>word2vec 原論文 Table 3 を、列を組み直して引きます。測り方は
  <b>640次元・同一データ・Semantic-Syntactic Word Relationship test set</b> です。</p>
 <div class="fml">モデル　　　　意味的類推 [%]　統語的類推 [%]<br>
  RNNLM　　　　　　　　 9　　　　　　　36<br>
  NNLM　　　　　　　　 23　　　　　　　53<br>
  CBOW　　　　　　　　 24　　　　　　　64<br>
  Skip-gram　　　　　 <em>55</em>　　　　　　　59</div>
 <div class="k how"><span class="kh">★ 測り方の注意</span>
  <b>この2つの列を並べて比較しないでください。土台が違います。</b>原典 Table 3 のキャプションは
  「our Semantic-Syntactic Word Relationship test set, and on the syntactic relationship test set of [20]」。
  つまり<b>意味的な列は著者らの自作テストセット、統語的な列は [20] のテストセット</b>です。
  「意味的55%に対し統語的59%だから統語のほうが得意」という読み方はできません。<br>
  ＊[20] は "king − man + woman" の例の出所と同じ論文です（Mikolov, Yih &amp; Zweig, NAACL HLT 2013。
  この資料はこの論文の本文を取得していません）。</div>
 <div class="k res"><span class="kh">★ 原典の留保</span>
  「計算されたベクトルに最も近い単語が正解と厳密に一致した場合のみ正答とみなす。
  <b>したがって同義語は誤りとして数えられる。これは 100% の精度に到達することがおそらく不可能であることも
  意味する</b>」（同論文 §4.1）</div>
 <h4>(2) 例の出所が、この論文の成果ではありません</h4>
 <p>word2vec 論文の本文はこの例を<b>先行研究の引用として</b>紹介しています。引用元は
  Mikolov, Yih &amp; Zweig「Linguistic Regularities in Continuous Space Word Representations」
  NAACL HLT 2013 という<b>別の論文</b>です。そして引用文の言い方は
  「<b>Queen の単語表現に最も近いベクトルになる</b>」であって、<b>「＝ Queen」ではありません。</b></p>
 <h4>(3) LLM の内部表現で同じ演算が成り立つ保証はありません</h4>
 <p>逆向きの報告が2本あります。分布仮説の原典は
  「<b>文脈の類似性が信頼できる基準となるのは、意味が非常に似ている語のペアを検出する場合に限られる</b>」。
  テキスト埋め込みを線形補間する手法は「この近接性が有意味な線形補間を可能にする。
  <b>埋め込みが離れていると線形な振る舞いを示さない</b>」と書き、だから埋め込みの最適化を100ステップに留めています。</p>
 <div class="k fix"><span class="kh">★ この例が教えていること</span>
  <b>基礎ほど誤りやすい、ということの実例です。</b>難しい原論文の話ではなく、

 <h4>横断軸 ── どの層にも属さないが、すべての層に効く</h4>
 <p>① <b>データ</b>：何を食わせたかが全層を規定する。② <b>トークナイズ</b>：入口で決めて【凍結】され、
  最終出力まで効く。③ <b>評価・較正</b>：どの層の成果も、測り方が決めてしまう。
  ④ <b>スケーリング則</b>：規模と性能の関係。全層に共通の物差し。</p>
 <h4>【A】モデルを作る工程 ── 順番があり、後戻りできない</h4>
 <p><b>L0 アーキテクチャ</b>（→§2）＝Transformer。自己注意で全部を同時に混ぜる。演算は完全に追えるが、
  なぜ賢いかは未解明。<br>
  ↓<b>L1 事前学習</b>（→§3）＝次トークン予測でスケールさせる。知識獲得・文脈内学習・
  「平均へ流れる」の発生源。<br>
  ↓⚠️ここから先は差し引きがある。<b>L2 選好整合（RLHF）</b>（→§4）。
  得るもの＝指示に従う・有用性（1.3B が 175B より好まれる）。
  失うもの＝一部の能力が下がる／較正が壊れる（ECE 0.007 → 0.074）。<br>
  ↓⚠️ここも差し引きがある。<b>L3 検証可能報酬RL</b>（→§5）。
  得るもの＝検証可能な領域で AIME 15.6% → 77.9%。
  失うもの＝人間の模範解答を挟むと AIME 77.9 → 59.0。<b>効くのは正誤が判定できる領域だけ。</b></p>
 <h4>【B】できたモデルの使い方 ── 訓練工程ではない</h4>
 <p>順番もなく、組み合わせます（→§6）。思考の誘導（Chain-of-Thought）／文脈に入れる（文脈内学習・

  約200語のニュース記事の判別実験（参加者621名）で、意図的に劣化させた対照モデルは正答率 <b>86%</b> で

 <div class="k fix"><span class="kh">★ 通説の訂正 ── (d) 「暗記だけ」でもない</span>

 <div class="k how"><span class="kh">★ 測り方の注意 ── 経験的証拠は「同じ方向」まで</span>

  注意出力の更新方向のコサイン類似度 <b>0.186 / 0.225</b>（ランダム更新は 0.002 / −0.001）。
  <b>有意ですが絶対値は小さい。</b>「AIは文脈内で学習している」と<b>断定すると言い過ぎ</b>になります。</div>
 <div class="k res"><span class="kh">★ 競合する仮説が複数ある（Survey §5.2.2）</span>

  当てている</b>」。<b>ここは未決着です。</b></div>
 <p class="src"><b>出典</b>　Dai et al. 2022「Why Can GPT Learn In-Context?」arXiv:2212.10559
  Eq.(12), §3.1, §3.2, Limitations ／ Dong et al. 2023「A Survey on In-context Learning」
  arXiv:2301.00234 §5.2.2</p>`},

 mai:'ここが第1章の「効きが鈍い」の出どころです。<span class="hl">2倍にして0.95倍</span>。この一文が、各社が桁で金をかける理由を説明します。',
 land:['規模を増やすと、間違いの量がなめらかなべき乗則で下がります。',
  '<b>効くが、驚くほど鈍い。2倍で0.95倍、10倍でも0.84倍。</b>だから桁で増やすしかありません。',
  'そして<b>なぜそうなるのかは、誰も分かっていません。</b>'],
 b:`<p><span class="cf a">◎</span>パラメータの数 N・読ませる量 D・計算量 C を増やすと、
  間違いの量（テスト損失）が何桁にもわたって<b>予測できる形で</b>下がります。</p>
 <div class="fml">L(N) ≈ (N<em>c</em> / N)^α<em>N</em>　　α<em>N</em> ≈ 0.076<br>
  L(D) ≈ (D<em>c</em> / D)^α<em>D</em>　　α<em>D</em> ≈ 0.095<br>
  L(C) ≈ (C<em>c</em> / C)^α<em>C</em>　　α<em>C</em> ≈ 0.050</div>
 <div class="dfig">${FIG.dull}
  <div class="cap">図は原典の値から本資料で作図。金額は説明のための絵です。</div></div>
 <div class="k str"><span class="kh">★ 原典がそのまま書いていること</span>
  「<b>パラメータ数を2倍にすると、損失は 2^(−0.076) = 0.95 倍だけ小さくなる</b>」。
  <b>この一文が、投資規模の理由を一言で説明します。</b></div>
 <h4>両対数にすると直線なので、作る前に読める</h4>
 <div class="dfig">${FIG.line}
  <div class="cap">3点を測って直線を伸ばすと、まだ作っていない大きいモデルの損失が読めます。</div></div>
 <div class="k how"><span class="kh">★ 測り方の注意</span>
  <b>N は「埋め込みを除いた」パラメータの数です。これは飾りではなく、法則が成立する条件です。</b></div>
 <div class="dfig">${FIG.embed}
  <div class="cap">原典 Figure 6。定義を落とすと法則そのものが崩れます。</div></div>
 <div class="k how"><span class="kh">★ 測り方の注意</span>
  <b>N_c・D_c・C_c の数値には本質的な意味がないと原典が明記しています。</b>
  「語彙サイズとトークナイズに依存し、したがって本質的な意味を持たない」。
  意味を持つのは<b>指数 α</b> だけです。</div>
 <p class="src"><b>出典</b>　Kaplan et al. 2020「Scaling Laws for Neural Language Models」
  arXiv:2001.08361 Eq.1.1-1.3 / 本文 / Figure 6</p>`},

{id:'s7-4-chinchilla',grp:'§7-4 スケーリング則',t:'計算予算の配分と、その後の修正',short:'配分と、その後の修正',

 <div class="k res"><span class="kh">★ 原典の留保</span>

{id:'s7-4-floor',grp:'§7-4 スケーリング則',t:'「打ち止め」は、原典が退けている',short:'「打ち止め」の否定',
 sec:'7-4',part:'第2部',gname:'横断軸',cf:'◎',where:'第1章「たくさん読ませる」／「効きが鈍い」／決算',
 mai:'よく聞く「そろそろ限界」という話は、<span class="ng">原典が明示的に退けています。</span>ここは間違えやすい場所です。',
 land:['損失は「規模で消せる部分」と「消せない部分（L∞）」に分かれます。',
  '<b>L∞ に近づくから収穫逓減、という推論を原典は退けています。</b>',
  '実測でも、生成の損失が飽和しても<b>下流の能力は別のべき乗則で伸び続けます。</b>'],
 b:`<div class="fml">L(x) = L∞ + (x<em>0</em> / x)^α<br>
  　　　　│　　　　└─ 削減できる部分（規模で消せる）<br>
  　　　　└─ 削減できない部分（データ本来のエントロピー）</div>
 <div class="dfig">${FIG.floor}
  <div class="cap">原典 §3, §3.4 の記述から本資料で作図。</div></div>
 <div class="k fix"><span class="kh">★ 通説の訂正</span>
  「L(x) 曲線が曲がって損失が L∞ に近づくと、見返りは逓減すると推測したかもしれない。
  しかし削減可能な損失を D_KL と同一視すると、<b>必ずしもそうではないことが示唆される</b>。
  さらなる規模の増加は、<b>依然として重要な追加的な意味情報をもたらしうる</b>」<br>
  → 使える言い方は「打ち止め」ではなく「<b>方向を指定するのは人間</b>」です。</div>
 <h4>ただし、外挿を信じてよいわけではない</h4>
 <div class="dfig">${FIG.extra}
  <div class="cap">原典 §6.3 の交点と、実測データの範囲を対比。本資料で作図。</div></div>
 <div class="k res"><span class="kh">★ 原典の留保</span>
  床（L∞）の見積もりは Kaplan §6.3 にもあり、L* ~ 1.7 nats/token を
  「自然言語のトークンあたりエントロピーの粗い見積もり」として出しています。<br>
  <b>ただしこの交点は実測の2桁以上先です。</b>原典自身も「数値は非常に不確かで、
  上下1桁変わりうる」と留保しています。<b>「外挿できる」と「外挿を信じてよい」は別です。</b></div>
 <p class="src"><b>出典</b>　Henighan et al. 2020「Scaling Laws for Autoregressive
  Generative Modeling」arXiv:2010.14701 §3, §3.4 ／
  Kaplan et al. 2020 arXiv:2001.08361 §6.3</p>`},

  逆向き（これを学習）: 各ステップで加えたノイズ ε を当てるネットワーク<br>
  　L<em>simple</em> = E[ ‖ ε − ε<em>θ</em>(x<em>t</em>, t) ‖² ]　　　← DDPM Eq.14</div>

 <p>＊設定値（全部原典）：T=1000（「スイープなしで設定した」）、β は 10⁻⁴ → 0.02 の線形増加、

  「前向き方程式と後ろ向き方程式が同じ係数で書ける」（Eq.76/77、脚注21）です。

 b:`<div class="k fix"><span class="kh">★ 避けた言い方 → 採った言い方（崩される原典）</span>
  RLVRで<b>能力が底上げ</b>された → <b>潜在能力が引き出され、分布が正しい方へ寄った</b>

  AIは<b>外挿できない</b> → AIは<b>方向を選べない</b> ── CoT §5 ／ Henighan §3<br><br>
  AIは偏見を<b>引き継ぐ</b> → <b>ラベルの選び方と閾値の決め方という、モデルの外側の設計が偏りを作る</b> ── CLIP §7.1<br><br>
  CoTは<b>推論時の計算量を増やす</b>から効く → <b>自然言語で・答えより先に・逐次的に</b>書く必要がある、まで。
  <b>なぜ効くかは原典も答えていない</b> ── CoT §3.3<br><br>
  ラベルが<b>間違っていても効く</b>から、AIは正しさを読んでいない → <b>対応の正しさは効く</b>。
  そのうえで<b>間違った対応を渡せば忠実に間違える</b> ── ICL Survey §5.1.2<br><br>
  AIの文章は<b>文体で見分けられる</b> → 文体では無理（判別52%）。
  <b>事実誤り・繰り返し・非論理の跳躍</b>で見分ける ── GPT-3 §3.9.4<br><br>
  専門難問は<b>AIが解けない</b> → <b>解ける問題を除外して作られている</b>（原典自ら "partially by design"）
  ── HLE § Accuracy, §3.2<br><br>
  AIは<b>暗記しているだけ</b> → 算術は<b>実際に計算を試みている</b>
  （3桁2,000問中、訓練データと一致は17問=0.8%）── GPT-3 §3.9.1<br><br>

    <button class="btn go" ${S.i<SEC.length-1?'':'disabled'} onclick="go(S.i+1)">次の節</button>
    <button class="btn more" onclick="backToGame()">${BACK.label}</button>
   </div>
  </div>`;
}
function say(){
 document.getElementById('said').innerHTML=
  `<span class="lbl">AI秘書・鳥居 麻衣</span><br>${SEC[S.i].mai}`;
 padStage();
}
/* ★節の中から別の節へ飛ぶ（★id で指す。★→ 03 §51-5。★反論が別の節にある箇所を繋ぐため） */
function goId(id){const i=SEC.findIndex(s=>s.id===id);if(i>=0)go(i)}
function go(i){
 if(i<0||i>=SEC.length)return;
 S.i=i; if(!S.seen.includes(i))S.seen.push(i);
 S.open=SEC[i].grp;                     /* ★読んでいる節のグループは開いた状態にする */
 paintTop();paintMenu();paintPane();say();
 const b=document.querySelector('.ibody'); if(b)b.scrollTop=0;
 history.replaceState(null,'','#'+SEC[i].id);
}
/* アンカーで飛んできたときは、その節に着地する */
function land(){
 const a=location.hash.replace('#','');
 const i=SEC.findIndex(s=>s.id===a);
 return i<0?0:i;
}
addEventListener('keydown',e=>{
 if(e.key==='Escape')shut();
 if(e.key==='ArrowRight')go(S.i+1);
 if(e.key==='ArrowLeft')go(S.i-1);
});

fit();S.i=land();S.seen=[S.i];S.open=SEC[S.i].grp;paintTop();paintMenu();paintPane();say();
</script>
</body>
</html>
