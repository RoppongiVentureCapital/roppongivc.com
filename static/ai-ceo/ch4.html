/* ══════════ 図（★fig.js の部品だけで描く。★新しい部品を作っていない）══════════

const F={
rlvr:(base,ver,gold)=>{
 const cap=D.set.staffCap, X=196, W=424, H=17;
 const w=n=>+(W*n/cap).toFixed(1);
 const rest=Math.max(0,cap-base-ver-gold);
 const segs=[[base,'#8fd8f0','見本を書く／答えを順位づける'],

 segs.forEach(([n,c])=>{const ww=w(n);

 <text x="${X+base+4}" y="104" fill="#a9e8c4" font-size="9.5">＋${gain} 上がる</text>

 <text x="10" y="148" fill="#f5c14e" font-size="12">安全が許すシェアの上限が ${gain} 上がります</text>
</svg>`}
};

/* ══════════════════════════════════════════════════════════════════════════

Object.assign(RUN,{year:D.year, from:3, verifier:0, gold:false, risk:false,

C.run=RUN;
const ASSIGNED0=RUN.assigned||0;
const STAFF0=RUN.staff||0;          // ★章に入った時点で雇っていた人数（★今年雇った分を出すため）

 hireCap :()=>D.set.staffCap+'名',                       // {雇用の上限}
 pay1    :()=>D.oku(D.set.staffPay)+'億円',              // {人件費}

 goldN   :()=>B.staff+'名',                              // {模範解答の人数}
 bothN   :()=>(A.staffMax+B.staff)+'名',                 // {2枚を上限まで取る人数}
 /* バー */
 rlvrUp  :()=>A.thinkMax,                                // {RLVRの効果}
 rlvrSafe:()=>D.set.rlvrSafe,                            // {RLVRの安全低下}
 goldUp  :()=>B.obey,                                    // {模範解答の効果}
 goldDn  :()=>Math.abs(B.think),                         // {模範解答の代償}
 /* 倍率と金額 */
 mulR    :()=>D.set.mulRlvr+'倍',                        // {RLVRの原価倍率}
 riskFee :()=>D.oku(K.cost)+'億円',                      // {リスク管理の費用}
 unitX   :()=>D.yen(D.set.equipX),                       // {設備の単価}
 /* ★上限の増減は【set.cap を2点で呼んで出す】。★式や数字を html に書かない

    ★{上限の上がり}   リスク管理を作ったときの上限の上がり

 capDn   :()=>D.set.cap(D.set.safeBase,false)
              -D.set.cap(D.set.safeBase-D.set.rlvrSafe,false),
 capUp   :()=>D.set.cap(D.set.safeBase,true)-D.set.cap(D.set.safeBase,false),

};

()=>`去年決めたのは、私の喋り方でした。今年鍛えるのは、<b>答えの中身</b>です。<br><br>
 なぜ今年これをやるのか、先に申し上げます。<br>
 去年までのやり方は、人が「どちらの答えが好きか」を選ぶものでした。<br>

()=>`人については、2つを決めます。<br>
 <span class="sm">1　これから何人雇うか<br>

/* ★★見出し2件は正本に無い（★§40-1' は麻衣の文だけを持つ）。★仮置きして申告する */

 lead:`人を雇います。何人雇うかを、あなたが決めます。<br>

rlvr:{
 lead:`ある研究チームが、人の模範解答を1問も使わずに、<br>

 def:`すると、誰も教えていないのに、AIが次のことを始めました。<br>

 ]},

const equipY  =()=>RUN.capacity*D.set.equipX/1000*(RUN.rlvr?D.set.mulRlvr:1)/1e8;
/* ★★上に出す資金は【設備費とリスク管理費を引かない】（★第3章と同じ理由）
   ★理由  ★★どちらも `ch4.data.js` が `fixed` に入れ、★その年の売上と差し引いて `left` を出す。
     ★★引いてから出すと、★売上が立つ前に「破産している」ように見える。
   ★★第4章のカードは全部0円である（★`dev:0`。★代償は人員と年費）。★だから開発費は引かない */
const money=()=>D.set.budget-RUN.spent-C.payroll(D,RUN)+(RUN.bonus||0);
const times=n=>{n=Math.round(n);
 return n>=1e12?(n/1e12).toFixed(2)+'兆回'
      :n>=1e8 ?(n/1e8 ).toFixed(2)+'億回'
      :n.toLocaleString()+'回'};
/* ★★いまの選択で必要な容量（★D.settle が返す use。★容量に依存しない量である） */
const needCap=()=>Math.ceil(D.settle(C.stFor(D,RUN,{capacity:0})).use);
/* ★選んだ端の名前（★名前の正本は上の TXT の ends[].name である） */
const endName=id=>{
 if(id==='hire')return RUN.staff+'名';
 if(id==='rlvr')return S.rlvr==null?null
  :(S.rlvr==='off'?'回さない':'回す（'+RUN.verifier+'名）');
 if(id==='gold')return S.gold==null?null:(S.gold?'入れる':'入れない');
 if(id==='risk')return S.risk==null?null:(S.risk?'作る':'作らない');
 if(id==='equip')return S.equip==null?null
  :(S.equip==='none'?'買わない':'多く買う（'+times(RUN.capacity)+'）');
 return null;
};
const decided=id=>id==='hire'?true
 :id==='rlvr'?S.rlvr!=null :id==='gold'?S.gold!=null
 :id==='risk'?S.risk!=null :S.equip!=null;
const undecidedIds=()=>['rlvr','gold','risk','equip'].filter(id=>!decided(id));
/* ★★設備は【必要な容量が決まってから】選ぶ（★第3章と同じ理由）。
   ★捌く回数は、考える力・指示に従う・安全（＝上限）から出る。★だから3枚を決めてから開く */
const equipOpen=()=>S.rlvr!=null&&S.gold!=null&&S.risk!=null;
/* ★端ごとに押せない理由を返す（→C.ends の why）
   ★★リスク管理は【資金で縛らない】（★2026-08-21 に直した。★通しで走らせて見つけた）
     ★理由  ★★`ch4.data.js` は `fixed = st.staff*staffPay + (st.risk?riskCost:0) + equip` で、
       ★★リスク管理の費用は【年末に精算する固定費】である（★開発費のように即時に払わない）。
       ★★第4章のカードは全部 `cost:0`＝開発費0円なので、★即時に払うものが1つも無い
     ★★実害が出ていた：★上のバーの資金は「予算 − 累計支出」で、★過去の売上を足さない形なので、
       ★★第3章で設備を買うと第4章では必ずマイナスになる。★★実測：★通しで5通り走らせて
       ★★4通りで「資金が足りない」になり、★★上限を戻す唯一の手が押せなくなっていた
     ★★→ ★これを外すと、★★§40-2'・§40-4' の「リスク管理で上限が戻る」が成立する */
const whyEnd=cardId=>e=>{
 if(cardId==='rlvr'&&e.id==='on'&&verMax()<1)return '人が足りない（1名以上必要）';
 if(cardId==='gold'&&e.id==='yes'&&freeNow()<B.staff)return `人が足りない（${B.staff}名必要）`;
 return null;
};

function capBox(){
 if(S.equip!=='buy')return '';
 const need=needCap(), cap=RUN.capacity, fee=equipY();
 if(need<=0)return C.note('安全が許すシェアの上限が 0% です。製品があっても、その年の売上は0です。');
 const b=(v,l)=>`<button class="btn" style="min-width:64px;padding:8px 6px"
   ${v===cap?'disabled':''} onclick="setCap(${v})">${l}</button>`;
 const R=D.settle(C.stFor(D,RUN,{capacity:cap}));
 return `<div class="def" style="border-color:#f5c14e;background:rgba(245,193,78,.08)">
  ${C.mline('いまの選択で必要な容量',times(need))}
  ${C.mline('買う容量',times(cap),cap<need?'#ff9d90':'#5ed093')}
  ${C.mline('設備費',D.oku(Math.round(fee))+' 億円')}
  ${C.mline('この容量で立つ売上',D.oku(Math.round(R.rev))+' 億円')}
  ${C.msub('設備費は、その年の売上から払います。')}
  ${RUN.rlvr?C.msub('「'+A.name+'」を押しているので、設備費は '+V.mulR()+' になっています。'):''}
  <div class="row" style="flex-wrap:wrap;gap:6px">
   ${b(Math.round(need*0.5),'必要の半分')}${b(need,'必要ちょうど')}
   ${b(Math.round(need*1.5),'必要の1.5倍')}${b(Math.round(need*2),'必要の2倍')}</div>
  ${C.note(cap<need
   ?'足りない分は捌けません。捌けなかった回は売上になりません。'
   :(cap>need?'余った分は、その年で消えます。':'必要な分だけ買っています。'))}
 </div>`;
}
function setCap(v){RUN.capacity=Math.max(0,v);paintTop();paintMenu();paintPane();say('equip')}
/* ★★設備の図（層1）── ★fig.js の G.equip を呼ぶだけ（★図の本体は html に写さない＝検査2）。
   ★★渡す値は capBox() が使っているものと同じ（needCap()・RUN.capacity・equipY()・times()・D.oku()）。
   ★★★need が 0 の年は【描かない】（★capBox() と同じ抜け道。★pct の0除算を作らない）。
   ★★買う量が決まっていない間（S.equip!=='buy'）は pct・bought・fee・rev を【渡さない】。 */
function equipFig(){
 if(!equipOpen())return '';
 const need=needCap(); if(need<=0)return '';
 const v={need:times(need)};
 if(S.equip==='buy'){
  const cap=RUN.capacity;
  const R=D.settle(C.stFor(D,RUN,{capacity:cap}));
  v.pct=cap/need*100;
  v.bought=times(cap);
  v.fee=D.oku(Math.round(equipY()))+' 億円';
  v.rev=D.oku(Math.round(R.rev))+' 億円';
 }
 return `<div class="fig">${G.equip(v)}</div>`;
}
function setVer(n){
 RUN.verifier=Math.max(0,Math.min(verMax(),n));
 RUN.rlvr=RUN.verifier>0;
 if(S.equip!=null){S.equip=null;RUN.capacity=0}
 paintTop();paintMenu();paintPane();say('rlvr');

function setN(n){S.hireN=Math.max(1,Math.min(Math.max(1,C.hireMax(D,RUN)),n));paintPane()}
function askHire(){

  body:`${C.mline('雇う人数',S.hireN+' 名')}

   ${C.mline('実行後の合計',(RUN.staff+S.hireN)+' 名')}
   ${C.mline('あと雇える',(C.hireMax(D,RUN)-S.hireN)+' 名')}
   ${C.msub('「あと雇える」は5年間の枠の残りです。')}
   ${C.mline('実行後の予算の残り',D.oku(money()-cost)+' 億円')}
   ${C.note('この章で雇えるのはこの1回だけです。人数はいま決めてください。')}`,
  ok:'雇う',run:'doHire()'});

function doHire(){
 if(S.hired)return;            /* ★★2回目は効かせない（★★画面からは押せないが、二重に塞ぐ） */
 const n=Math.min(S.hireN,C.hireMax(D,RUN));
 if(n<1)return;
 RUN.staff+=n;
 S.hired=true;
 paintTop();paintMenu();paintPane();say('hire');
}
function pick(cardId,endId){
 /* ★★人が足りない端は効かせない（★★`C.ends` の `why` が既に押せなくしているが、二重に塞ぐ）
    ★理由  ★★下の式は `Math.max(1,…)` を持っていて、★★空きが0名でも1名を配属していた
      （★実測：★第1章で10名雇って見本に10名固定した通しで、★空き0名なのに検証器に1名入った）。
      ★★画面からは押せないので出ないが、★★存在しない人員が入る形は残さない */
 if(cardId==='rlvr'&&endId==='on'&&verMax()<1)return;
 if(cardId==='gold'&&endId==='yes'&&freeNow()<B.staff)return;
 if(cardId==='rlvr'){
  S.rlvr=endId;
  RUN.verifier=(endId==='on')
   ?Math.max(0,Math.min(A.staffMax,Math.min(S.verN,freeNow()+RUN.verifier))):0;
  RUN.rlvr=RUN.verifier>0;
 }else if(cardId==='gold'){
  S.gold=(endId==='yes');
  RUN.gold=S.gold;
  /* ★★模範解答に10名を回すと、★検証器に回せる人数が減る。★はみ出した分は戻す */
  if(RUN.verifier>verMax())RUN.verifier=Math.max(0,verMax());
  RUN.rlvr=RUN.verifier>0;
 }else if(cardId==='risk'){
  S.risk=(endId==='yes'); RUN.risk=S.risk;
 }else if(cardId==='equip'){
  S.equip=endId;
  RUN.capacity=(endId==='buy')?needCap():0;
 }
 /* ★★必要な容量は上の3枚で変わる。★選び直したら買った量を戻す（★古い量を残さない＝型⑥を塞ぐ） */
 if(cardId!=='equip'&&S.equip!=null){S.equip=null;RUN.capacity=0}
 RUN.assigned=ASSIGNED0+usedHere();
 paintTop();paintMenu();paintPane();say(cardId);
}

 if(last==='rlvr'){

 if(last==='gold'){

   ?`人の模範解答を <span class="hl">入れます</span>。<br>
     <span style="color:#bcccdd">指示に従うが上がり、考える力が下がります。
     安全が許すシェアの上限も ${V.capDn()} 下がります。</span>`
   :`人の模範解答は入れません。<span class="ok">考える力は下がりません。</span>`)+restLine())}
 if(last==='risk'){
  return C.say((S.risk
   ?`リスク管理のしくみを <span class="hl">作ります</span>。<br>

   :`リスク管理のしくみは作りません。<span class="ng">安全が許すシェアの上限は上がりません。</span>`)

 if(last==='equip'){

 C.say(`${D.card(last).name}を決めました。`+restLine());
}

function settle(){
 const nd=undecidedIds();
 if(nd.length){S.sel=nd[0];paintMenu();paintPane();return say('__need')}
 const R=D.settle(C.stFor(D,RUN,{capacity:RUN.capacity}));
 const T=R.rlvr?SET.A:SET.B;
 const left=C.leftOf(RUN,R);
 const yen=n=>D.oku(Math.round(n))+' 億円';
 const safeNG=()=>{let v=0;for(let s=0;s<=100;s++)if(D.set.cap(s,!!RUN.risk)<=0)v=s;return v};
 const FLOW=()=>`<div class="fig">${G.flow({
   appeal:C.n1(R.appeal)+' / '+D.set.full+' 点',  rival:C.n1(R.rival)+' 点',
   target:D.pct(R.target), share:D.pct(R.share),
   cap:D.pct(R.cap),      sold:D.pct(R.sold),
   need:times(R.use),     bought:RUN.capacity>0?times(RUN.capacity):'買っていません',
   served:times(R.served),rev:yen(R.rev),
   depth:R.depth.toFixed(3)+' 倍'})}</div>`;

 const s1=`
  ${C.bars(R.bars,['考える力','指示に従う','安全'])}
  ${C.msub('自信の正しさは、去年で決まった値のままです。この章に動かすカードはありません。答えの幅も、去年のままです。')}
  <div class="fig">${G.safe({safe:R.safe, ng:safeNG(), cap:D.pct(R.cap), base:D.set.safeBase})}</div>
  <details class="cite"><summary>くわしく知る</summary>
   <span class="sm">害になる答えを受け取るのは、あなたのAIを使う客です。<br>
   客が多ければ、受け取る人も多くなります。<br>
   このゲームは、客が多いほど高い安全を要求する形にしています。<br>
   指示に従う力を上げた分だけ、ここから引かれます。</span></details>
  <h4>今年決めたこと</h4>
  ${C.mline('検証器に回した人数',R.verifier+' 名')}
  ${C.mline('人の模範解答',RUN.gold?'入れた':'入れない')}
  ${C.mline('リスク管理のしくみ',RUN.risk?'作った（今年の分）':'作らない')}
  ${C.mline('買った容量',RUN.capacity>0?times(RUN.capacity):'買っていません')}
  ${C.mline('今年雇った人数',(RUN.staff-STAFF0)+' 名')}
  <h4>人員の枠</h4>
  ${C.mline('5年間の枠',D.set.staffCap+' 名')}
  ${C.mline('これまでに投じた枠',RUN.staff+' 名')}
  ${C.mline('残っている枠',R.staffFree+' 名')}
  ${C.msub('この枠は年ごとに戻りません。投じた工程から人は戻ってきません。')}
  <h4>バーがどれだけ動いたか</h4>
  ${C.mline('考える力の伸び',C.sign(R.thinkAdd))}
  ${C.msub('検証器に回した人数の分だけ上がります。去年の「答えの幅」で決まる倍率が掛かります。')}
  ${C.mline('去年の答えの幅で決まる倍率',C.n1(RUN.mul==null?1:RUN.mul)+' 倍')}
  <h4>売れたか</h4>
  ${FLOW()}
  ${C.note('<b>この図の読み方</b><br>'+
    '<b>魅力</b> ── あなたのAIが客から見てどれだけ選ばれるかの点数です。'+
    '満点は '+D.set.full+' 点です。<br>'+
    '同じ画面の「他社の力」と比べます。この2つの取り分が、下の行になります。<br>'+
    '<b>落ち着くシェア</b> ── 毎年、差の '+(D.set.follow*100)+'% ずつ'+
    '近づいていく先の割合です。単位は％です。<br>'+
    '「何年目に届く」という数ではありません。今年の結果でもありません。')}
  <div class="fig">${G.calib({ece:C.n1(R.ece)+' ポイント', calib:R.cal+' 点', depth:R.depth.toFixed(3)+' 倍'})}</div>
  <details class="cite"><summary>くわしく知る</summary>
   <span class="sm">「自信の正しさ」は 100 からこの数を引いた点数です。<br>
   「一人あたりの利用量」に客の数を掛けたものが、上の図の「必要だった容量」になります。<br>
   ずれは第3章で決まっていて、この章では動きません。信用できないAIは使われません。</span></details>
  ${C.mline('設備は足りたか',R.capBound?'足りなかった':'足りた',R.capBound?'#ff9d90':null)}
  ${C.msub('上の図の「必要だった容量」と「買った容量」を見比べてください。')}
  ${R.capBound?C.msub('捌けなかった回は売上になりません。'):
    (RUN.capacity>R.use?C.msub('余った容量は、その年で消えます。'):'')}
  ${RUN.capacity>0?'':C.msub(R.use>0
    ?'買った容量が0なので、捌けた回数は0回です。'
    :'捌く回数が0なので、設備は要りません。')}
  ${C.mline('1回あたりの費用の倍率',R.mult+' 倍')}
  ${C.msub('1回答えるごとにかかる費用が、何倍になったかです。押した枚数だけ掛け合わさります（足し算ではありません）。'+
    '運用費と設備費の両方に、同じ倍率が掛かります。')}
  <h4>使ったお金</h4>
  ${C.mline('売上',yen(R.rev))}
  ${C.mline('運用費',yen(R.op))}
  ${C.mline('設備費',yen(R.equip))}
  ${RUN.capacity>0?'':C.msub('買った容量が0なので、設備費は0円です。')}
  ${C.mline('リスク管理の費用',yen(RUN.risk?D.set.riskCost:0))}
  ${C.mline('開発費',yen(R.dev))}
  ${C.mline('人件費（'+D.year+'年目）',yen(RUN.staff*D.set.staffPay)+'（'+RUN.staff+'名）')}
  ${C.mline('今年の利益',yen(R.profit),R.profit<0?'#ff9d90':'#5ed093')}
  ${C.mline('予算の残り',yen(left))}
  ${(left<0 && !RUN.rescued)?C.note('予算が足りなくなった年です。'+D.oku(D.set.rescue)+'億円 を借りました。1回だけの借入です。<br>'+
    'この分は、5年目の成績から引かれます。'):''}
  <details class="cite"><summary>1,000回あたりの粗利　${D.yen(R.gross)}</summary>
   <span class="sm">この数は、1,000回あたりで黒字かどうかを見るための数です。<br>
   ここがマイナスだと、売れるほど損になります。<br>
   売値から運用費だけを引いた数です。設備費は引いていません。</span></details>
  ${R.cap<=0?C.note('今年は、安全が許すシェアの上限が 0% でした。だから売上は0です。<br>'+
    'この上限は安全から決まります。'+
    '安全を下げたカードは、今年の決算の「今年決めたこと」に出ています。<br>'+
    'リスク管理のしくみを作ると、上限は上がります。ただし戻せるのは1枚分だけです。<br>'+
    '上限を下げるカードを2枚とも取っていると、作っても 0% のままになることがあります。'):''}`;

 const tail=`
  <h4>章末の事実（判断には使いません）</h4>
  ${FACTS.map(f=>C.fact(f)).join('')}
  <div class="row">
   <button class="btn" onclick="location.reload()">やり直す</button>
   <button class="btn go" onclick="toCh5()">第5章へ</button></div>
  <details class="cite"><summary>この画面の数字の出どころ</summary>
   正答率（章末の事実）は DeepSeek-R1, arXiv:2501.12948 §2・Table 3。
   採点用データの誤った注釈は Shao et al. 2024, arXiv:2402.03300 §5.2.3。
   人手の件数は Ouyang et al. 2022, arXiv:2203.02155 Table 6・§3.4。<br>
   <b>市場の大きさ・他社の力・設備の単価・5本のバーの目盛り・人件費・リスク管理の費用・
   答えが長くなる分の倍率は、ゲームのために置いた値です。</b></details>`;

 C.dlg(C.settleFrame({title:'第4章 決算',head:T.head,
  s1,s2:C.mai(T.s2(R)+'<br><br>'+SET.fore,'#67d3e8'),
  s3label:T.s3label,s3:T.s3,s4:T.s4,tail}));
 RUN.rlvr=R.rlvr; RUN.verifier=R.verifier;
 C.closeYear(D,R,RUN);
 C.run=RUN;
}
function toCh5(){C.save(RUN);location.href='ch5.html'}

/* ══════════ 起動 ══════════ */
C.boot(()=>{if(S.phase!=='intro')say(lastSay)});

 document.querySelector('.panel').classList.add('full');
 document.getElementById('menu').innerHTML=`<div class="grpL ol">第4章</div>`;
 document.getElementById('pane').innerHTML=`
  ${C.head('第4章',[['第4章','—','']])}
  <div class="pc"><div class="ibody">
   <p class="lead">第4章は、第3章の結果を引き継いで始まります。</p>
   <div class="note">第3章を締めた記録が見つかりません。<br>

   </div>
   <div class="row"><button class="btn go" onclick="location.href='ch1.html'"
     >第1章へ</button></div></div>`;
