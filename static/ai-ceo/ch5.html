  ${C.head(`${i+1}. ${INTRO_T[i]}`,[['第5章',i+1,'/ '+pages.length]])}
  <div class="pc">
   <div class="ibody">${pages[i]()}</div>
   <div class="row">
    <button class="btn" ${i?'':'disabled'} onclick="iBack()">戻る</button>
    <button class="btn go" onclick="iNext()">${last?'カードを見る':'次へ'}</button>
   </div></div>`;
}
function iGo(i){S.ip=i;if(!S.seen.includes(i))S.seen.push(i);
 paintPane();paintMenu();const b=document.querySelector('.ibody');if(b)b.scrollTop=0}
function iNext(){S.ip<INTRO.length-1?iGo(S.ip+1):startGame()}
function iBack(){if(S.ip)iGo(S.ip-1)}
function startGame(){S.phase='play';
 document.querySelector('.panel').classList.remove('full');
 document.documentElement.classList.remove('intro');
 paintMenu();paintPane();say(null)}
function reIntro(){S.phase='intro';iGo(0);say(null)}

function paintPane(){
 if(S.phase==='intro')return paintIntro();
 const c=D.card(S.sel), t=TXT[c.id];
 const body=(c.id==='equip'&&!equipOpen())
  ? `<div class="note" style="border-left-color:#f5c14e;color:#ffdf9c">
      いまは決められません。先に使い方の ${shown().length}枚 を決めてください。<br>
      捌く回数と、設備にかかる倍率が、その ${shown().length}枚 から決まります。</div>`
  : c.id==='equip'
  ? `${capBox()}${C.ends(c.id,t.ends,S.equip)}`
  : `${C.ends(c.id,t.ends,S.pick[c.id])}${c.id==='maj'?majBox():''}`;
 document.getElementById('pane').innerHTML=`
  ${C.head(c.name,[['開発費',D.oku(0),'億円','y']])}
  <div class="pc"><div class="cbody">
   <p class="lead">${t.lead}</p>
   <div class="def">${t.def}</div>
   <div class="note">${t.note}</div>
   ${body}
   ${C.src(c.tag,c.cite)}
  </div>
  ${H(c.id)?`<div class="row"><button class="btn more" onclick="C.pop(H('${c.id}'))"
    >くわしく知る</button></div>`:''}
  </div>`;
}
/* ★★多数決が効くかどうかを、選んだ直後に見える位置に出す（★→C.CROSS ⑤。★C.voteOk） */
function majBox(){
 if(S.pick.maj!=='yes')return '';
 const w=Math.max(0,Math.min(100,RUN.width+(RUN.temp?TP.width:0)));
 const ok=C.voteOk(D,w);
 return `<div class="def" style="border-color:${ok?'#5ed093':'#e0574a'};
  background:rgba(${ok?'94,208,147':'224,87,74'},.08)">
  ${C.mline('いまの答えの幅',C.n1(w),ok?'#5ed093':'#ff9d90')}
  ${C.mline('多数決が効く下限',V.majMin())}
  ${C.note(ok?'いまの答えの幅なら、多数決が効きます。'
   :'いまの答えの幅では、多数決を取っても答えは変わりません。'+
    '「温度を上げる」を選ぶと、答えの幅が上がります。')}
 </div>`;
}
/* ★★買う容量を決める欄（★第3章・第4章と同じ形。★倍率が設備費にも掛かる） */
function capBox(){
 if(S.equip!=='buy')return '';
 const need=needCap(), cap=RUN.capacity;
 if(need<=0)return C.note('安全が許すシェアの上限が 0% です。製品があっても、その年の売上は0です。');
 const b=(v,l)=>`<button class="btn" style="min-width:64px;padding:8px 6px"
   ${v===cap?'disabled':''} onclick="setCap(${v})">${l}</button>`;
 const R =D.settle(C.stFor(D,RUN,Object.assign(stUse(),{capacity:cap})));
 const R0=D.settle(C.stFor(D,RUN,Object.assign(stUse(),{capacity:0})));
 return `<div class="def" style="border-color:#f5c14e;background:rgba(245,193,78,.08)">
  ${C.mline('いまの選択で必要な容量',times(need))}
  ${C.mline('買う容量',times(cap),cap<need?'#ff9d90':'#5ed093')}
  ${C.mline('1回あたりの費用の倍率',R.mult+' 倍')}
  ${C.msub('1回答えるごとにかかる費用が、何倍になったかです。押した枚数だけ掛け合わさります（足し算ではありません）。'+
    '運用費と設備費の両方に、同じ倍率が掛かります。')}
  ${C.mline('設備費',D.oku(Math.round(R.equip))+' 億円')}
  ${C.mline('この容量で立つ売上',D.oku(Math.round(R.rev))+' 億円')}
  ${C.mline('この容量での今年の利益',D.oku(Math.round(R.profit))+' 億円',
    R.profit<0?'#ff9d90':'#5ed093')}
  ${C.mline('買わなかった場合の今年の利益',D.oku(Math.round(R0.profit))+' 億円',
    R0.profit<0?'#ff9d90':'#5ed093')}
  ${C.msub('この2つを見比べてください。倍率が上がりきると、買わないほうが損が小さくなります。')}
  <div class="row" style="flex-wrap:wrap;gap:6px">
   ${b(Math.round(need*0.5),'必要の半分')}${b(need,'必要ちょうど')}
   ${b(Math.round(need*1.5),'必要の1.5倍')}${b(Math.round(need*2),'必要の2倍')}</div>
  ${C.note(R.profit<R0.profit
   ?'この容量で買うと、買わない場合より利益が小さくなります。'
   :(cap<need?'足りない分は捌けません。捌けなかった回は売上になりません。'
     :(cap>need?'余った分は、その年で消えます。':'必要な分だけ買っています。')))}
 </div>`;
}
function setCap(v){RUN.capacity=Math.max(0,v);paintTop();paintMenu();paintPane();say('equip')}
function pick(cardId,endId){
 if(cardId==='equip'){
  S.equip=endId;
  RUN.capacity=(endId==='buy')?needCap():0;
 }else{
  S.pick[cardId]=endId;
  RUN[cardId]=(endId==='yes');
  /* ★★必要な容量と倍率は使い方で変わる。★選び直したら買った量を戻す（★古い量を残さない） */
  if(S.equip!=null){S.equip=null;RUN.capacity=0}
 }
 paintTop();paintMenu();paintPane();say(cardId);
}
function say(last){
 if(last!==undefined)lastSay=last;
 if(S.phase==='intro'){
  return C.say(`${C.menuSide()}のメニューから、いつでもこの説明に戻れます。<br>
   読み終わったら <span class="hl">「第5章をはじめる」</span> を押してください。`)}
 if(last==='__need'){
  const nd=undecidedIds();
  if(!nd.length)return say(null);
  return C.say(`まだ選んでいないカードが ${nd.length}枚 あります。<br>
   <span class="hl">${D.card(nd[0]).name}</span> を決めてください。`)}
 if(!last){
  const n=undecidedIds().length;
  return C.say(n
   ?`${C.menuSide()}のメニューから選んでください。<br>
     <span style="color:#bcccdd">今年は開発費が0円です。払うのは
     <span class="hl">1回答えるごとの費用</span> です。
     まだ選んでいないカードが ${n}枚 あります。</span>`
   :`選び終わりました。<span class="hl">「${D.year}年目を締める」</span> に進んでください。<br>
     <span style="color:#bcccdd">今年の決算が最後になります。</span>`)}
 if(last==='equip'){
  const need=needCap();
  return C.say((S.equip==='none'
   ?`設備を買いません。<span class="ng">1回も捌けないので、その年の売上は0です。</span>`
   :need<=0
   ?`安全が許すシェアの上限が 0% です。<span class="ng">製品があっても、その年の売上は0です。</span>`
   :`容量を <span class="hl">${times(RUN.capacity)}</span> 買いました。<br>
     <span style="color:#bcccdd">必要なのは ${times(need)} です。${
      RUN.capacity<need?'足りない分は捌けません。':
      (RUN.capacity>need?'余った分はその年で消えます。':'ちょうどです。')}</span>`)+restLine())}
 if(last==='maj'&&S.pick.maj==='yes'){
  const w=Math.max(0,Math.min(100,RUN.width+(RUN.temp?TP.width:0)));
  return C.say((C.voteOk(D,w)
   ?`多数決を取ります。<span class="ok">いまの答えの幅なら効きます。</span>`
   :`多数決を取ります。<span class="ng">ただし、いまの答えの幅では効きません。</span><br>
     <span style="color:#bcccdd">「温度を上げる」を選ぶと、答えの幅が上がります。</span>`)
   +restLine())}
 const e=TXT[last]&&TXT[last].ends.find(x=>x.id===S.pick[last]);
 C.say(`<span class="hl">${e?e.name:D.card(last).name}</span> にしました。`+restLine());
}

/* ══════════ 決算（→03 §41-6 ／ §41-6' ／ 01 §4 の段の順序）══════════
   ★★最終年である。★5年間の累計と、★救済を借入として引く分は【土台が持つ】（★C.score。→C.CROSS ⑧） */
function settle(){
 const nd=undecidedIds();
 if(nd.length){S.sel=nd[0];paintMenu();paintPane();return say('__need')}
 const R=D.settle(C.stFor(D,RUN,Object.assign(stUse(),{capacity:RUN.capacity})));
 const T=(R.mult>1)?SET.A:SET.B;
 const left=C.leftOf(RUN,R);
 const yen=n=>D.oku(Math.round(n))+' 億円';
 /* ★★安全がここまで下がると「出せるシェアの上限」が 0% になる、という点数（→03 §81-4 の差し込み口）
    ★★式も数字も書かない ── ★`D.set.cap` を 0〜100 で呼んで、★0% になる一番上の点を探す
      （★★第4章の `V.safeNG()` と同じ作り方である）。★★リスク管理の有無で境目が変わるので
      ★★いまの `RUN.risk` を渡す（★第3章には無いので false になる） */
 const safeNG=()=>{let v=0;for(let s=0;s<=100;s++)if(D.set.cap(s,!!RUN.risk)<=0)v=s;return v};
 /* ★★決算1段目の頭に置く流れ図（→記録 §125-1・§125-2。★★宛先は3章とも同じ1枚である）
    ★出どころ ★★初見役が【3章とも同じ場所で読むのをやめた】。★★かつ2章で同じ図を欲しがった
      ★「魅力 → 目標のシェア → 今年のシェア → 上限 → 実際に出せた → 必要な容量 → 捌けた回数 → 売上、
        ★が一本の矢印でつながっていれば、20行を目で追わずに済みました」
    ★★図の字は `fig.js` の `G.flow` が持つ（★★文面役の持ち物。★こちらは字を1つも書いていない）
    ★★ここが渡すのは【表示用の文字列だけ】である（★★算術を1つも足していない）。
      ★★下の行と【同じ関数】で作っている ＝★同じ画面の2つの表示が食い違わない
      （★★食い違いは1回踏んでいる。→記録 §109 のバーと数字） */
 const FLOW=()=>`<div class="fig">${G.flow({
   appeal:C.n1(R.appeal)+' / '+D.set.full+' 点',  rival:C.n1(R.rival)+' 点',
   target:D.pct(R.target), share:D.pct(R.share),
   cap:D.pct(R.cap),      sold:D.pct(R.sold),
   need:times(R.use),     bought:RUN.capacity>0?times(RUN.capacity):'買っていません',
   served:times(R.served),rev:yen(R.rev),
   /* ★★一人あたりの利用量（★2026-08-22 に足した。→03 §81-2）
      ★出どころ ★★初見役「★図に『一人あたりの利用量』の箱が無いので、
        ★シェアだけで容量が決まるのか、★別の数も掛かっているのか、図からは判断できませんでした」
      ★★下の行と【同じ関数】で作っている（★★図と行で数が食い違わない） */
   depth:R.depth.toFixed(3)+' 倍'})}</div>`;
 const yn=(v,a,b)=>v?a:b;

 /* ★★「この図の読み方」は2つだけである（★03 §81-1。★★2026-08-22 に3つ落とした）
    ★★落としたのは 今年のシェア ／ 出せるシェアの上限 ／ 実際に出せたシェア
    ★★理由（★初見役の言葉）★「助けになったのは最初の2つだけです。
      ★残りの3つは、読む量が増えただけだと感じました」
      ★「『上限は安全から決まる』は3か所に出てきます」
      ★「『実際に出せたシェアは小さいほう』も、図で矢印が2本合流している形を見れば分かることでした」
    ★★落とした3行の中身は【1文字も別の場所に移していない】（★★移すと同じことになる） */
 const s1=`
  ${C.bars(R.bars,['考える力','答えの幅'])}
  ${C.msub('指示に従うは第3章で決まった値のまま、自信の正しさも第3章のままです。'+
    '安全は、去年 正誤で鍛えたかどうかだけで決まっています。この章に動かすカードはありません。')}
  <div class="fig">${G.safe({safe:R.safe, ng:safeNG(), cap:D.pct(R.cap), base:D.set.safeBase})}</div>
  <details class="cite"><summary>くわしく知る</summary>
   <span class="sm">害になる答えを受け取るのは、あなたのAIを使う客です。<br>
   客が多ければ、受け取る人も多くなります。<br>
   このゲームは、客が多いほど高い安全を要求する形にしています。<br>
   指示に従う力を上げた分だけ、ここから引かれます。</span></details>
  <h4>今年決めたこと</h4>
  ${C.mline('途中を書かせる',yn(RUN.cot,'書かせた','書かせない'))}
  ${C.mline('例を見せる',yn(RUN.few,'見せた','見せない')
    +(RUN.rlvr?'（去年 正誤で鍛えたので、効果は逆を向いています）':''))}
  ${C.mline('道具を呼ぶ',hidden('tool')?'選べません（去年 正誤で鍛えたため）'
    :yn(RUN.tool,'呼んだ','呼ばない'))}
  ${C.mline('温度を上げる',yn(RUN.temp,'上げた','上げない'))}
  ${C.mline('多数決を取る',!RUN.maj?'取らない'
    :(R.majOK?'取った':'取った（答えの幅が '+V.majMin()+' 未満なので効きません）'),
    (RUN.maj&&!R.majOK)?'#ff9d90':null)}
  ${C.mline('買った容量',RUN.capacity>0?times(RUN.capacity):'買っていません')}
  <h4>売れたか</h4>
  ${FLOW()}
  ${C.note('<b>この図の読み方</b><br>'+
    '<b>魅力</b> ── あなたのAIが客から見てどれだけ選ばれるかの点数です。'+
    '満点は '+D.set.full+' 点です。<br>'+
    '同じ画面の「他社の力」と比べます。この2つの取り分が、下の行になります。<br>'+
    '<b>落ち着くシェア</b> ── 毎年、差の '+(D.set.follow*100)+'% ずつ'+
    '近づいていく先の割合です。単位は％です。<br>'+
    '「何年目に届く」という数ではありません。今年の結果でもありません。')}
  ${C.mline('1回あたりの費用の倍率',R.mult+' 倍')}
  ${C.msub('1回答えるごとにかかる費用が、何倍になったかです。押した枚数だけ掛け合わさります（足し算ではありません）。'+
    '運用費と設備費の両方に、同じ倍率が掛かります。')}
  <div class="fig">${G.calib({ece:C.n1(R.ece)+' ポイント', calib:R.cal+' 点', depth:R.depth.toFixed(3)+' 倍'})}</div>
  <details class="cite"><summary>くわしく知る</summary>
   <span class="sm">「自信の正しさ」は 100 からこの数を引いた点数です。<br>
   「一人あたりの利用量」に客の数を掛けたものが、上の図の「必要だった容量」になります。<br>
   ずれは第3章で決まっていて、この章では動きません。信用できないAIは使われません。</span></details>
  ${C.mline('設備は足りたか',R.capBound?'足りなかった':'足りた',R.capBound?'#ff9d90':null)}
  ${C.msub('上の図の「必要だった容量」と「買った容量」を見比べてください。')}
  ${R.capBound?C.msub('捌けなかった回は売上になりません。'):
    (RUN.capacity>R.use?C.msub('余った容量は、その年で消えます。'):'')}
  ${RUN.capacity>0?'':C.msub(R.use>0
    ?'買った容量が0なので、捌けた回数は0回です。'
    :'捌く回数が0なので、設備は要りません。')}
  <h4>使ったお金</h4>
  ${C.mline('売上',yen(R.rev))}
  ${C.mline('運用費',yen(R.op))}
  ${C.mline('設備費',yen(R.equip))}
  ${RUN.capacity>0?'':C.msub('買った容量が0なので、設備費は0円です。')}
  ${C.mline('開発費',yen(R.dev)+'（この章はAIを作り直さないので 0 です）')}
  ${C.mline('人件費（'+D.year+'年目）',yen(RUN.staff*D.set.staffPay)+'（'+RUN.staff+'名）')}
  ${C.mline('リスク管理の費用',yen(RUN.risk?D.set.riskCost:0))}
  ${C.mline('今年の利益',yen(R.profit),R.profit<0?'#ff9d90':'#5ed093')}
  ${C.mline('予算の残り',yen(left))}
  <details class="cite"><summary>1,000回あたりの粗利（設備費を引く前）　${D.yen(R.gross)}</summary>
   <span class="sm">この数は、1,000回あたりで黒字かどうかを見るための数です。<br>
   ここがマイナスだと、売れるほど損になります。<br>
   売値から運用費だけを引いた数です。設備費は引いていません。<br>
   だから、この数が黒でも、設備を増やすと利益が減る年があります。<br>
   増やすかどうかは、上の「今年の利益」で見てください。</span></details>`;

 /* ★★5年間の成績（★最終年だけの段。★★項目名は正本に無い＝実装役が置いた。★申告する）
    ★★引く側は土台が持つ（★C.score。★救済は【借入】である＝設計役の決定 2026-08-19）
    ★★年を閉じてから作る（★★閉じる前に作ると、★★今年破産した分の借入が出ない）。
      ★★実測して直した（★★閉じる前に作っていて、★資金が尽きた回でも「借りた分 なし」と出た） */
 C.closeYear(D,R,RUN);
 const sc=C.score(D,RUN);
 const s5=`
  <h4>5年間の成績</h4>
  ${C.mline('5年間の累計利益',yen(sc.cum),sc.cum<0?'#ff9d90':'#5ed093')}
  ${sc.rescued?C.mline('資金が尽きたときに借りた分',yen(sc.loan),'#ff9d90')
   +C.msub('資金が0を下回った年に、'+V.loan()+' を【借りました】。'+
     'これは出資ではなく借入です。5年間の成績から '+V.loan()+' を引きます。')
   :C.mline('資金が尽きたときに借りた分','なし')}
  ${C.mline('最後の成績',yen(sc.total),sc.total<0?'#ff9d90':'#ffdf9c')}
  ${C.msub('5年間の利益を足して、借りた分を引いた数です。')}`;

 /* ══════════ ★★5年の総評（★山田様の決定26 の本体。→01 §5-2／04 §16）══════════
    ★★s5（5年間の成績）と s6（これまでの成績）の間に sV を差し込む（s1:s1+s5+sV+s6）。
    ★★使うのは【すでに盤面に在る量だけ】（→01 §5-3）。★新しい量・02 の値・評語を1つも足さない。
    ★段1  どんなAIができたか ── 5本のバーが5年でどう動いたかを図1枚（G.trend）。
      ★★closeYear は上で済んでいる＝run.log に5年目まで入っている（node で 5×5 を確認）。
      ★渡すのは run.log の bars の値そのまま（★[考える力,指示に従う,自信の正しさ,安全,答えの幅]）。
      ★字は G.trend が持つ。★ここは見出し1行だけ。
    ★段2  良かった点・悪かった点 ── ★★【評語を使わない】（良い／悪いの境目は山田様の判断待ち）。
      ★盤面に実在する事実だけ：一番高い／低いバーの名前と点、安全と上限0%の境目、答えの幅と多数決の下限。
      ★実測に無い因果を1つも作らない（→記録 §1 の却下リスト）。★折りたたみ前は6行以内。 */
 const barVals=R.bars.map(x=>x[1]);
 const hi=R.bars.reduce((a,b)=>b[1]>a[1]?b:a);
 const lo=R.bars.reduce((a,b)=>b[1]<a[1]?b:a);
 const sV=`
  <h4>どんなAIができたか</h4>
  <div class="fig">${G.trend({years:RUN.log.map(e=>e.bars.map(g=>g[1]))})}</div>
  <h4>いまの5本の高い・低い</h4>
  ${C.mline('一番高いバー',hi[0]+' '+hi[1]+' 点')}
  ${C.mline('一番低いバー',lo[0]+' '+lo[1]+' 点')}
  ${C.mline('安全',R.safe+' 点（上限が0%になる境目は '+safeNG()+' 点）')}
  ${C.mline('答えの幅',barVals[4]+' 点（多数決が効く下限は '+V.majMin()+' 点）')}`;

 /* ══════════ ★★段3 他社と比べた結果（★山田様の決定26 の段3。→レビュー役の判定＝道B）══════════
    ★★並べるのは【すでに盤面に在る2つ】── R.appeal（あなたの魅力）と R.rival（他社の力）。
      ★上の FLOW（G.flow）が同じ2つを同じ形で並べている。★新しい形を発明していない。
    ★★【満点は自分側にだけ付ける】（★FLOW と同じ形。★rival に満点は付けない）。
    ★★勝敗の語を使わない ── 「上回っています／届いていません」まで。「勝ち」は書かない。
    ★★序章が「5年目には他社の力があなたの満点を超えます」と明言している（＝設計の意図）。
      ★だから rival が full を超えていても不具合ではない。★断り1行でそれを言う。
    ★★字も算術も足していない ── R.appeal・R.rival・D.set.full は FLOW と【同じ量】である。 */
 const over=R.appeal>=R.rival;
 const sCmp=`
  <h4>他社と比べて</h4>
  ${C.mline('あなたの魅力',C.n1(R.appeal)+' / '+D.set.full+' 点')}
  ${C.mline('他社の力',C.n1(R.rival)+' 点',over?'#5ed093':'#ff9d90')}
  ${C.msub('あなたの魅力は他社の力を'+(over?'上回っています':'下回っています')+
    '。この2つは同じ目盛りの上にあり、取り分（上の図の「今年のシェア」）はこの2つの大小で決まります。'+
    '他社の力は年ごとに上がり、5年目にはあなたの満点を超えることがあります。')}`;

 /* ══════════ ★★段4 5年で決めたこと1枚（★山田様の決定26 の段4。→折りたたみ）══════════
    ★★並べるのは【第3章の3件】と【第4章の3件】だけ（★第5章の使い方は s1 の「今年決めたこと」に出るので出さない）。
    ★★id → 日本語名は 03 §90 の対応表を【そのまま写した】（★②が ch3.data.js の opts[].name から写した正本）。
      ★★long（＝ch3.data.js の name そのまま）を採る。★理由＝mline は「項目名：値」の1行で、
        既存の決算行（「去年 正誤で鍛えたので…」等）が同等以上の長さを問題なく出しており、
        long のほうが写し元と1文字も違わず正確だから（→報告）。
    ★★第3章の basis は pref が 'none'（やらない）のとき盤面に出ない（→ ch3.data.js の needs:'pref'）。
      ★だから pref が 'none' のときは basis を「やらないので設定なし」と出す（★新語を作らず、既存の語で書く）。
    ★★第4章の3件（verifier・gold・risk）は ch4.html の「今年決めたこと」と【同じ表現】を写した
      （★検証器＝『○名』／模範解答＝『入れた／入れない』／リスク管理＝『作った／作らない』）。
    ★★値はすべて RUN に実在する（★RUN0 に pref・basis・price・verifier・gold・risk がある。node で確認）。
    ★★折りたたみ（details class="cite"）。★summary は「5年で決めたこと」の1行だけ。 */
 const NAME={
  pref :{none:'やらない', weak:'弱', mid:'中', strong:'強'},
  basis:{A:'有用性に寄せる', mid:'原典と同じ', C:'謙虚さに寄せる'},
  price:{high:'高く売る', std:'標準', low:'安く配る'}
 };
 const prefV =NAME.pref[RUN.pref||'none'];
 const basisV=(RUN.pref==='none'||!RUN.pref)?'やらないので設定なし'
             :(NAME.basis[RUN.basis||'mid']);
 const priceV=NAME.price[RUN.price||'std'];
 const s4card=`
  <details class="cite"><summary>5年で決めたこと</summary>
   <h4>第3章で決めたこと</h4>
   ${C.mline('好み訓練の強さ',prefV)}
   ${C.mline('渡す基準',basisV)}
   ${C.mline('売値',priceV)}
   <h4>第4章で決めたこと</h4>
   ${C.mline('検証器に回した人数',RUN.verifier+' 名')}
   ${C.mline('人の模範解答',RUN.gold?'入れた':'入れない')}
   ${C.mline('リスク管理のしくみ',RUN.risk?'作った':'作らない')}
  </details>`;

 /* ══════════ 歴代の成績（★山田様の決定26「順位を競う形は残す」。→記録 §138-2 の道A）══════════
    ★★積むのは【最後の成績（sc.total）】と【日時】だけ（土台の C.pushScore）。★新しい数字は作らない。
    ★★積む口・並べる口は ch_common.js（別キー genron.hist）。★C.drop（1年目から遊びなおす）では消えない。
    ★★順位を前に出さない（決定12）＝「5年間の成績」のあとに静かに置く。★高い順に並べ、今回に印を付ける。
    ★★★字に必ず入れる断り＝この順位は【このブラウザで遊んだ自分の過去の回】との比較であって、
      ★他の人との比較ではない（★これが無いと嘘になる）。 */
 const myIdx=C.pushScore(sc.total);          // ★今回を積む（戻り値＝今回の番号。使えない環境では -1）
 const hist=C.history();                     // ★積んだ順の配列 [{total,at}]
 let s6='';
 if(hist.length<=1){
  s6=`
   <h4>これまでの成績</h4>
   ${C.msub('今回が1回目です。上の「最後の成績」が、あなたの記録です。'+
     'もう一度遊ぶと、ここに過去の回が高い順に並びます。')}
   ${C.note('ここに並ぶのは、<b>このブラウザで遊んだ、あなた自身の過去の回</b>です。'+
     '他の人の成績とは比べていません（他の人と比べるにはサーバが必要です）。')}`;
 }else{
  /* ★高い順に並べる。★元の番号（今回＝myIdx）を持ったまま並べ替えて、今回に印を付ける */
  const rows=hist.map((h,i)=>({i,total:h.total}))
    .sort((a,b)=>b.total-a.total)
    .map((r,rank)=>{
     const mine=(r.i===myIdx);
     const mark=mine?' <span style="color:#ffdf9c">← 今回</span>':'';
     const col=mine?'#ffdf9c':(r.total<0?'#ff9d90':null);
     return C.mline((rank+1)+' 位',yen(r.total)+mark,col);
    }).join('');
  s6=`
   <h4>これまでの成績</h4>
   ${rows}
   ${C.msub('高い順に並べています。合わせて '+hist.length+' 回 遊びました。')}
   ${C.note('ここに並ぶのは、<b>このブラウザで遊んだ、あなた自身の過去の回</b>です。'+
     '他の人の成績とは比べていません（他の人と比べるにはサーバが必要です）。')}`;
 }

 const tail=`
  <h4>章末の事実（判断には使いません）</h4>
  ${FACTS.map(f=>C.fact(f)).join('')}
  <div class="row">
   <button class="btn" onclick="location.reload()">やり直す</button>
   <button class="btn" onclick="C.drop();location.href='ch1.html'">1年目から遊びなおす</button>
   <button class="btn go" onclick="C.openDoc('#s9-1-mystery')"
    >まだ分かっていないことを読む</button></div>
  <p class="lead">この5年で、AIが賢く働くのに、その理由はまだ誰にも分かっていないと知りました。<br>
   その分かっていない問題に、今この瞬間、世界中の人が実際に手を動かして挑んでいる場所があります。<br>
   Kaggle です。同じデータと同じ問いが公開され、誰でも自分のやり方で答えを出して試せます。<br>
   あなたが会社で動かしてきた判断を、今度は本物のAIで確かめる番です。ここがその入口です。</p>
  <div class="row"><a class="btn go" href="https://www.kaggle.com/"
    target="_blank" rel="noopener">本物のAIを試しに行く（Kaggle）</a></div>
  <details class="cite"><summary>この画面の数字の出どころ</summary>
   正答率（章末の事実）は Wei et al. 2022, arXiv:2201.11903 Fig.2・Appendix Table 3。
   注目の総量は Vaswani et al. 2017, arXiv:1706.03762 §3.2.1。
   例を増やすと悪くなりうることは Dong et al. 2023, arXiv:2301.00234 §7。
   分かっていないことの範囲は Kaplan et al. 2020, arXiv:2001.08361 Appendix C。<br>
   <b>市場の大きさ・他社の力・設備の単価・5本のバーの目盛り・人件費・
   1回あたりの費用の倍率・答えの幅の下限は、ゲームのために置いた値です。</b></details>`;

 C.dlg(C.settleFrame({title:'第5章 決算 ── 5年目',head:T.head,
  s1:s1+s5+sV+sCmp+s4card+s6,s2:C.mai(T.s2(R)+'<br><br>'+SET.fore,'#67d3e8'),
  s3label:T.s3label,s3:T.s3,s4:T.s4,tail}));
 C.save(RUN);
 C.run=RUN;
}

/* ══════════ 起動 ══════════ */
C.boot(()=>{if(S.phase!=='intro')say(lastSay)});
if(!HAND){
 /* ★第4章を通っていない（★仮定値を作らない） */
 document.querySelector('.panel').classList.add('full');
 document.getElementById('menu').innerHTML=`<div class="grpL ol">第5章</div>`;
 document.getElementById('pane').innerHTML=`
  ${C.head('第5章',[['第5章','—','']])}
  <div class="pc"><div class="ibody">
   <p class="lead">第5章は、第4章の結果を引き継いで始まります。</p>
   <div class="note">第4章を締めた記録が見つかりません。<br>
    第1章から順に遊んでください。第4章の決算で「第5章へ」を押すと、ここに続きます。</div>
   </div>
   <div class="row"><button class="btn go" onclick="location.href='ch1.html'"
     >第1章へ</button></div></div>`;
 C.say('第4章の結果が見つかりません。第1章から順に遊んでください。');
}else{
 paintTop();paintMenu();paintPane();say(null);
}
</script>
