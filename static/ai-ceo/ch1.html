function why(a){
 if(a.kind==='staff'){
  if(S.log.includes(a.id))return'済み（この章では雇用は1回だけ）';
  if(hireMax()<=0)return`これ以上は雇えない（上限${D.set.staffCap}名）`;
  if(costOf(a)>money())return'資金が足りない';
  return null}
 if(S.log.includes(a.id))return'実施済み';
 if(a.kind==='train'&&S.trained)return'AIを作るのは1回だけ';
 if(a.kind==='sft'&&!S.trained)return'先にAIを作る必要がある';
 if(a.staff&&freeStaff()<a.staff)return`人が足りない（${a.staff}名必要）`;
 if(a.cost>money())return'資金が足りない';
 return null;
}

/* 縮小率が 0.8 を下回ると文字が読めなくなるので、その手前で額縁をやめて
   通常フロー（.fluid）に切り替える。閾値は 820x615 の1か所だけで管理する */
function fit(){
 const fluid=innerWidth<820||innerHeight<615;
 const r=document.documentElement;
 r.classList.toggle('fluid',fluid);
 r.classList.toggle('narrow',fluid&&innerWidth<400);
 /* 横持ちで高さが足りない場合は縦積みをやめて2カラムにする */
 r.classList.toggle('side',fluid&&innerWidth>=620&&innerWidth>innerHeight);
 r.style.setProperty('--s',fluid?1:Math.min(innerWidth/1024,innerHeight/768));
 resay();padStage();
}

   秘書のセリフは長さが変わるので、固定値では隠れる */
function padStage(){
 const st=document.querySelector('.stage'),inf=document.querySelector('.info');
 if(!st||!inf)return;

}

function exec(id){
 const a=A.find(x=>x.id===id);
 if(a.kind==='staff'){
  S.staff+=S.hireN;
  S.hireN=Math.min(10,Math.max(1,hireMax()));
  S.log.push(id);
 }else{
  S.dev+=a.cost;S.used+=a.turn;S.log.push(id);
  if(a.staff)S.assigned+=a.staff;
  if(a.kind==='train')S.trained=a;
 }
 const nx=A.find(x=>!why(x));if(nx)S.sel=nx.id;
 paintTop();paintMenu();paintPane();say(id);
}

function openDoc(anchor){
