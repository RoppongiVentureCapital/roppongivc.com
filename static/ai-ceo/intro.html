const FROM=(()=>{const m=/[?&]from=(ch\d+)\.html/.exec(location.search);
 return m?m[1]:null})();
const BACK=FROM?{href:FROM+'.html',label:FROM.replace('ch','第')+'章に戻る'}
              :{href:'ch1.html',label:'第1章をはじめる'};

let S={ip:0,seen:[0]};

function paintIntro(){
 const i=S.ip,last=i===INTRO.length-1;
 document.querySelector('.panel').classList.add('full');
 document.documentElement.classList.add('intro');
 /* ★★秘書の全身は【1ページ目だけ】（★決定5。★隠すボタンは作らない）。
    ★★読み返したときも出す ＝★★`?from=` があっても同じ条件である（★ページ番号だけで決める） */
 document.documentElement.classList.toggle('firstpage', i===0);
 document.getElementById('pane').innerHTML=`
  <div class="pt"><h2 class="ol">${i+1}. ${INTRO_T[i]}</h2><div class="tag">
   <span><span class="k ol">序章</span> <span class="v c n ol">${i+1}</span>
    <span class="k ol">/ ${INTRO.length}</span></span>
  </div></div>
  <div class="pc">
   <div class="ibody">${INTRO[i]}</div>
   <div class="row">
    <button class="btn" ${i?'':'disabled'} onclick="iBack()">戻る</button>
    <button class="btn go" onclick="iNext()">${last?BACK.label:'次へ'}</button>
   </div>
  </div>`;
}
function iGo(i){
 S.ip=i; if(!S.seen.includes(i))S.seen.push(i);
 paintIntro();paintMenu();
 const b=document.querySelector('.ibody'); if(b)b.scrollTop=0;
}
function iNext(){S.ip<INTRO.length-1?iGo(S.ip+1):leave()}
function iBack(){if(S.ip)iGo(S.ip-1)}
/* ★序章を出る。★★`?from=` があればその章へ、★無ければ第1章へ */
function leave(){location.href=BACK.href}

/* ══════════ 左メニュー（目次）══════════
   ★ch1.html の paintMenu の【序章の枝】を写した。★最後の1行だけ戻る先が変わる */
function paintMenu(){
 let h=`<div class="grpL ol">序章 ── 麻衣の説明</div>`;
 INTRO_T.forEach((t,i)=>{
  const sc=S.ip===i;
  h+=`<div class="mi ${sc?'sel':''} ${S.seen.includes(i)&&!sc?'done':''}" data-ip="${i}"
   ><div class="t${sc?'':' ol'}">${i+1}. ${t}</div></div>`});
 h+=`<div class="grpL ol">${FROM?'本編にもどる':'本編'}</div>
  <div class="mi fin" data-id="__leave"><div class="t ol">${BACK.label}</div>
   <div class="sub ol">${FROM?'読み返しを終わる':'AIを1体つくる'}</div></div>`;
 h+=`<div class="grpL ol">説明</div>
  <div class="mi" data-id="__doc"><div class="t ol">資料を開く</div>
   <div class="sub ol">AIの原理 ／ 原論文32本</div></div>`;
 document.getElementById('menu').innerHTML=h;
 document.querySelectorAll('.mi').forEach(el=>el.onclick=()=>{
  if(el.dataset.id==='__leave'){leave();return}
  if(el.dataset.id==='__doc'){C.openDoc('');return}
  iGo(+el.dataset.ip)});
}

/* ══════════ 起動 ══════════
   ★★秘書の台詞は序章では出さない（★ch1.html の序章と同じ。★say(null) に当たる） */
C.boot?C.boot(()=>{}):0;
document.getElementById('said').innerHTML='';
paintMenu();paintIntro();
</script>
</body>
</html>
