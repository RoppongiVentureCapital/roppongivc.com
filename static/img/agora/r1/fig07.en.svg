<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img"
     aria-label="The division of labor in creation. Step 1, the human sets the direction: which kind of new is worth aiming at. Step 2, the AI produces non-obvious links fast and in bulk. Step 3, the human judges, testing with counterexamples whether a candidate is genuine or contrived.">
<!-- 余白 16/24/28/64 ＋外周32。書体は1つ。箱と矢印の羅列をやめ、上の罫線と番号で順序を示す -->
<style>
text{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;font-weight:400;fill:#333}
.eyebrow{font-size:13.5px;font-weight:600;fill:#8a8a8a}
.deck{font-size:27px;font-weight:600;fill:#111}
.who{font-size:13.5px;font-weight:600}
.label{font-size:20px;font-weight:600;fill:#111}
.body{font-size:16.5px}
</style>

<text class="eyebrow" x="32" y="44">Division of labor in creation ── performed over these two hours</text>

<text class="deck" x="32" y="108">All the AI can produce is candidates.</text>
<text class="deck" x="32" y="148">The aim and the judgment sit with the human.</text>

<line x1="32"  y1="204" x2="221" y2="204" stroke="#019949" stroke-width="3"/>
<text class="who"   x="32" y="230" fill="#019949">Human</text>
<text class="label" x="32" y="258">1 Direction</text>
<text class="body"  x="32" y="290">Which kind of new</text>
<text class="body"  x="32" y="318">is worth aiming at</text>

<line x1="285" y1="204" x2="474" y2="204" stroke="#c4c4c4" stroke-width="3"/>
<text class="who"   x="285" y="230" fill="#8a8a8a">AI</text>
<text class="label" x="285" y="258">2 Candidates</text>
<text class="body"  x="285" y="290">Produce non-obvious</text>
<text class="body"  x="285" y="318">links fast and in bulk</text>

<line x1="538" y1="204" x2="727" y2="204" stroke="#019949" stroke-width="3"/>
<text class="who"   x="538" y="230" fill="#019949">Human</text>
<text class="label" x="538" y="258">3 Judgment</text>
<text class="body"  x="538" y="290">Genuine or contrived ──</text>
<text class="body"  x="538" y="318">test with counterexamples</text>

</svg>
