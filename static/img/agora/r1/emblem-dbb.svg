<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" role="img" aria-label="Deep Black Box">
<!-- ★2026-09-08 製品名を「AIの詰将棋」→「Deep Black Box」に変えたことに伴う新エンブレム。
     将棋の駒（五角形＋【AI】）を廃止し、蓋の開いた黒い箱＋中のニューラルネットにした。
     ★幾何（勝手に動かさないこと。動かすなら再計算する）
       箱   M8 22 L8 34 L22 40 L36 34 L36 22 L22 28 Z（口の傾き 6/14）
       蓋   元の案Bの厚みのある菱形を1.4下げ、白い隙間を0.6pxにしてある
       AI   蓋の上面に、面内の軸に沿って寝かせている（matrix・Avenir Next 9.5・右下へ流れる）
       網   2:3:2 ＝ 問9と同じ構成（重み2×3+3×2、辺12本）
            ★各層の中心を「箱の口から6.0px下」に置いてあるので、左右が高く中央が
              4.71px低い。これは箱の口の傾きと同じ比率。★左右は必ず同じ高さ
       検算 全ノードが箱の輪郭から半径0.85ぶん内側にあることを確認済み
     ★ゲーム側（ゲーム/ai-shogi/common.js の drawTop）も同じ絵に差し替えること -->
