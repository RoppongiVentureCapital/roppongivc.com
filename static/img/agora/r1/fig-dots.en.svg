<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img"
     aria-label="Dots representing the elements an AI has learned. There are 28 dots, and choosing two of them gives 28 times 27 divided by 2, or 378 combinations. Just one line is drawn in green, linking shogi and Kaggle. A real AI holds far more elements than this; the number of dots is schematic.">
<!--
  ★fig06.svg の差し替え。旧版は左右2パネル（外装＝人が見ている世界／内装＝AIが見ている世界）
    だったが、「外装／内装」という語をコラム5から捨てたので、1パネルにした。
    ★旧 fig06.svg は消していない（戻せるように残す）
  ★余白のルール（fig-kaggle・fig-agent・fig-howto・fig-reward と同じ）基準単位 8px。外周 32
  ★点は 7列×4行＝28個。378通りは 28×27÷2 で読者が検算できる。
    ★点の数は模式。実際の要素の数は桁が違う（図4と同じ断りを足元に置く）
-->
<style>
text{
  font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
  font-weight:400; fill:#333;
}
.eyebrow{font-size:13.5px;font-weight:600;fill:#8a8a8a;letter-spacing:.02em}
.deck{font-size:27px;font-weight:600;fill:#111}
.nd{fill:#c9c9c9}
.hi{fill:#019949}
.tag{font-size:14px;font-weight:600;fill:#019949}
.foot{font-size:14px;font-weight:600;fill:#111}
.note{font-size:11.5px;fill:#b8b8b8}
</style>

<rect width="760" height="400" fill="#fff"/>

<text class="eyebrow" x="32" y="34">What the AI has learned</text>
<text class="deck" x="32" y="72">The lines nobody has drawn yet remain</text>

<rect x="32" y="100" width="696" height="212" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1.5"/>

<!-- 緑の連結（点より先に引いて、点を上に載せる） -->
<line x1="190" y1="188" x2="566" y2="280" stroke="#019949" stroke-width="2.5"/>

<!-- 1行目 y=142 -->
<circle class="nd" cx="96"  cy="142" r="5"/><circle class="nd" cx="190" cy="142" r="5"/>
<circle class="nd" cx="284" cy="142" r="5"/><circle class="nd" cx="378" cy="142" r="5"/>
<circle class="nd" cx="472" cy="142" r="5"/><circle class="nd" cx="566" cy="142" r="5"/>
<circle class="nd" cx="660" cy="142" r="5"/>

<!-- 2行目 y=188（190 が将棋） -->
<circle class="nd" cx="96"  cy="188" r="5"/>
<circle class="nd" cx="284" cy="188" r="5"/><circle class="nd" cx="378" cy="188" r="5"/>
<circle class="nd" cx="472" cy="188" r="5"/><circle class="nd" cx="566" cy="188" r="5"/>
<circle class="nd" cx="660" cy="188" r="5"/>

<!-- 3行目 y=234 -->
<circle class="nd" cx="96"  cy="234" r="5"/><circle class="nd" cx="190" cy="234" r="5"/>
<circle class="nd" cx="284" cy="234" r="5"/><circle class="nd" cx="378" cy="234" r="5"/>
<circle class="nd" cx="472" cy="234" r="5"/><circle class="nd" cx="566" cy="234" r="5"/>
<circle class="nd" cx="660" cy="234" r="5"/>

<!-- 4行目 y=280（566 が Kaggle） -->
<circle class="nd" cx="96"  cy="280" r="5"/><circle class="nd" cx="190" cy="280" r="5"/>
<circle class="nd" cx="284" cy="280" r="5"/><circle class="nd" cx="378" cy="280" r="5"/>
<circle class="nd" cx="472" cy="280" r="5"/>
<circle class="nd" cx="660" cy="280" r="5"/>

<!-- 連結された2点 -->
<circle class="hi" cx="190" cy="188" r="8"/>
<text class="tag" x="190" y="168" text-anchor="middle">Shogi</text>
<circle class="hi" cx="566" cy="280" r="8"/>
<text class="tag" x="566" y="304" text-anchor="middle">Kaggle</text>

<!-- 足元 -->
<path d="M32 340 L728 340" stroke="#ececec" stroke-width="1"/>
<text class="foot" x="32" y="366">28 dots. Choosing two gives 28 × 27 ÷ 2 = 378 combinations. The green line is one of them</text>
<text class="note" x="32" y="390">A real AI holds far more elements than this. The number of dots is schematic, not measured.</text>
</svg>
