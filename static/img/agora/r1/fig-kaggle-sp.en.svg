<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 306 1226" role="img"
     aria-label="How Kaggle works, in three steps. One, everyone is given the same table; the example theme is passengers on the Titanic, and in the bottom rows whether the passenger survived is hidden, which is what you predict. Two, you train a model and produce predictions from the passengers' features, turning the knobs until it fits, and you can resubmit many times a day. Three, you are ranked by accuracy: the share you got right is your score. Accuracy rises as you submit more, but there is no perfect score and it approaches a ceiling. The table and rankings are examples.">
<!--
  ★スマホ用の縦版（図1 fig-kaggle）。パソコン用は fig-kaggle.svg（横長 760×520）
  ★viewBox 306 ＝ 画面375pxで図が出る実寸。最小14px。使える幅は x=14〜292 の278px
  ★★丸数字（①②③）をやめて 1 2 3 にした（→ 105 §8-8 ⑪。図7・図4と同じ）
    ★横長版には ①②③ が残っている
  ★この版 ── 表を間引く:いいえ ／ 順位表をHTMLへ出す:いいえ
  ★tools/gen_fig_kaggle_sp.py が生成している。手で直さず、生成器を直すこと
-->
<style>
text{
  font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
  font-weight:400; fill:#333;
}
.eyebrow{font-size:14px;font-weight:600;fill:#7d7d7d;letter-spacing:.02em}
