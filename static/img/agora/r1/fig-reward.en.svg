<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 556" role="img"
     aria-label="The three things AI training aims at, none of which is newness. One, trace what it has seen: data is text from the internet, the task is predicting the next word. Two, lean toward human preference: data is records of human choices, the task is making the chosen one score higher. Three, things a machine can mark: data is mathematics and code, the task is having a machine check against the key. None of the three contains a measure of whether something is a valuable kind of new. Below, a commonplace answer is picked as good by most people, while genuine newness is legible to only a few, gets no points, and is erased in training. The bar lengths are schematic, not measured.">
<!--
  ★余白のルール（fig-kaggle・fig-agent・fig-howto と同じ）基準単位 8px。外周 32
  ★書体は1つだけ。差は大きさ・太さ・色だけ
  ★★fig04.svg の差し替え。旧版は①を「ありがち＝よく見るパターン」と書いていたが、
    これは誤り。次の1語を当てる訓練は珍しい語にも正しい確率を付けるよう鍛える。
    無難さが出るのは「出すときの選び方」で、そこはコラム4の図が扱う。
    ★旧 fig04.svg は消していない（戻せるように残す）
  ★下段の棒は長さの比だけを示す模式。実測値ではない
-->
<style>
text{
  font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
  font-weight:400; fill:#333;
}
.eyebrow{font-size:13.5px;font-weight:600;fill:#8a8a8a;letter-spacing:.02em}
.deck{font-size:27px;font-weight:600;fill:#111}
.no{font-size:12px;font-weight:600;fill:#fff}
.label{font-size:14px;font-weight:600;fill:#111}
.sub{font-size:11.5px;fill:#8a8a8a}
.mid{font-size:15px;font-weight:600;fill:#111}
.bar{font-size:12.5px;fill:#333}
.note{font-size:11.5px;fill:#b8b8b8}
</style>

<rect width="760" height="556" fill="#fff"/>

<text class="eyebrow" x="32" y="34">What AI training aims at</text>
<text class="deck" x="32" y="72">There are three. None of them is newness</text>

<!-- ===== 上段 3つの訓練 ===== -->
<g>
  <rect x="32" y="100" width="216" height="176" rx="6" fill="#fff" stroke="#c4c4c4" stroke-width="1"/>
  <circle cx="60" cy="128" r="11" fill="#9a9a9a"/><text class="no" x="60" y="132" text-anchor="middle">1</text>
  <text class="label" x="80" y="133">Trace what it has seen</text>
  <path d="M52 156 L228 156" stroke="#ececec" stroke-width="1"/>
  <text class="sub" x="52" y="182">Data</text><text class="sub" x="88" y="182" fill="#333">text from the internet</text>
  <text class="sub" x="52" y="208">Task</text><text class="sub" x="88" y="208" fill="#333">predict the next word</text>
  <text class="sub" x="52" y="244">It is trained to give correct</text>
  <text class="sub" x="52" y="260">probabilities to rare words too</text>
</g>

<path d="M252 188 L266 188" stroke="#9a9a9a" stroke-width="1.5" fill="none"/>
<path d="M266 184 L272 188 L266 192 Z" fill="#9a9a9a"/>

<g>
  <rect x="272" y="100" width="216" height="176" rx="6" fill="#fff" stroke="#c4c4c4" stroke-width="1"/>
  <circle cx="300" cy="128" r="11" fill="#9a9a9a"/><text class="no" x="300" y="132" text-anchor="middle">2</text>
  <text class="label" x="320" y="133">Lean toward human preference</text>
  <path d="M292 156 L468 156" stroke="#ececec" stroke-width="1"/>
  <text class="sub" x="292" y="182">Data</text><text class="sub" x="328" y="182" fill="#333">records of human choices</text>
  <text class="sub" x="292" y="208">Task</text><text class="sub" x="328" y="208" fill="#333">the chosen one scores higher</text>
  <text class="sub" x="292" y="244">scored by majority vote</text>
</g>

<path d="M492 188 L506 188" stroke="#9a9a9a" stroke-width="1.5" fill="none"/>
<path d="M506 184 L512 188 L506 192 Z" fill="#9a9a9a"/>

<g>
  <rect x="512" y="100" width="216" height="176" rx="6" fill="#fff" stroke="#c4c4c4" stroke-width="1"/>
  <circle cx="540" cy="128" r="11" fill="#9a9a9a"/><text class="no" x="540" y="132" text-anchor="middle">3</text>
  <text class="label" x="560" y="133">Things a machine can mark</text>
  <path d="M532 156 L708 156" stroke="#ececec" stroke-width="1"/>
  <text class="sub" x="532" y="182">Data</text><text class="sub" x="568" y="182" fill="#333">mathematics, code</text>
  <text class="sub" x="532" y="208">Task</text><text class="sub" x="568" y="208" fill="#333">a machine checks the key</text>
  <text class="sub" x="532" y="244">only where an answer key exists</text>
</g>

<!-- ===== 中間の一行 ===== -->
<rect x="32" y="304" width="696" height="52" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1"/>
<text class="mid" x="52" y="336">None of these three contains a measure of whether something is a valuable kind of new</text>

<!-- ===== 下段 多数決では拾えない ===== -->
<text class="eyebrow" x="32" y="404">So should we just have people choose which is newer in 2?</text>

<rect x="32" y="422" width="696" height="94" rx="6" fill="#f7f7f7" stroke="#c4c4c4" stroke-width="1"/>

<text class="bar" x="52" y="456">Commonplace answer</text>
<rect x="176" y="446" width="300" height="13" rx="2" fill="#9a9a9a"/>
<text class="sub" x="490" y="456" fill="#333">most people pick it as good</text>

<text class="bar" x="52" y="492">Genuine newness</text>
<rect x="176" y="482" width="17" height="13" rx="2" fill="#c0392b"/>
<text class="sub" x="490" y="486" fill="#333">only a few can see the value</text>
<text class="sub" x="490" y="503" fill="#c0392b">→ no points, so training erases it</text>

<text class="note" x="32" y="540">The bar lengths are schematic, not measured values.</text>
</svg>
