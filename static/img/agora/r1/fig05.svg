<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" role="img"
     aria-label="左は雑な問いのときの確率分布。ありふれた答えに山が立ち、新しいものは裾に埋もれる。右は条件を重ねたあと。分布そのものが作り替えられ、さっきまで裾だった場所に新しい山が立つ。">
<style>
text{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo','Helvetica Neue',Arial,sans-serif;fill:#111}
.tt{font-size:22px;font-weight:600}
.ax{font-size:17px;fill:#9a9a9a}
.cp{font-size:18px;fill:#6e6e6e}
.b1{fill:#c9c9c9}
.b2{fill:#019949}
</style>

<text class="tt" x="40"  y="30">雑な問い</text>
<text class="tt" x="410" y="30">条件を重ねたあと</text>
<text class="ax" x="40"  y="58">確率</text>
<text class="ax" x="410" y="58">確率</text>

<line x1="384" y1="20" x2="384" y2="256" stroke="#e6e6e6" stroke-width="1"/>

<!-- 左：ありふれた答えに山が立つ -->
<rect class="b1" x="48"  y="240" width="28" height="10"/>
<rect class="b1" x="80"  y="224" width="28" height="26"/>
<rect class="b1" x="112" y="200" width="28" height="50"/>
<rect class="b1" x="144" y="164" width="28" height="86"/>
<rect class="b1" x="176" y="132" width="28" height="118"/>
<rect class="b1" x="208" y="164" width="28" height="86"/>
<rect class="b1" x="240" y="200" width="28" height="50"/>
<rect class="b1" x="272" y="224" width="28" height="26"/>
<rect class="b1" x="304" y="240" width="28" height="10"/>
<line x1="40" y1="250" x2="348" y2="250" stroke="#333" stroke-width="1.5"/>
<text class="cp" x="40" y="286">ありふれた答えに山が立つ。</text>
<text class="cp" x="40" y="310">新しいものは裾に埋もれて出てこない</text>

<!-- 右：分布そのものが作り替えられる -->
<rect class="b1" x="408" y="238" width="28" height="12"/>
<rect class="b1" x="440" y="238" width="28" height="12"/>
<rect class="b1" x="472" y="236" width="28" height="14"/>
<rect class="b1" x="504" y="238" width="28" height="12"/>
<rect class="b1" x="536" y="240" width="28" height="10"/>
<rect class="b1" x="568" y="238" width="28" height="12"/>
<rect class="b2" x="600" y="132" width="28" height="118"/>
<rect class="b1" x="632" y="238" width="28" height="12"/>
<rect class="b1" x="664" y="240" width="28" height="10"/>
<line x1="400" y1="250" x2="708" y2="250" stroke="#333" stroke-width="1.5"/>

<text class="cp" x="470" y="104" fill="#019949" font-weight="600">さっきまで裾だった場所</text>
<line x1="608" y1="112" x2="612" y2="126" stroke="#019949" stroke-width="2"/>
<polygon points="614,132 604,124 618,120" fill="#019949"/>

<text class="cp" x="400" y="286">分布そのものが作り替えられ、</text>
<text class="cp" x="400" y="310">埋もれていた場所に新しい山が立つ</text>

<line x1="40" y1="330" x2="720" y2="330" stroke="#e6e6e6" stroke-width="1"/>
<text class="cp" x="40" y="354" font-size="17">温度を下げるのは、同じ分布の中で山を選びやすくするだけ</text>
<text class="cp" x="40" y="378" font-size="17">条件を足すのは、分布そのものを変形させる操作</text>
</svg>
