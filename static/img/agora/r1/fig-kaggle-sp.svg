<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 306 1226" role="img"
     aria-label="Kaggleの仕組み。1、テーマ例としてタイタニック号の乗客名簿が全員に配られる。下の行は生き残ったかどうかが隠されている。2、モデルに学習させて、その隠れた答えを予測して出す。1日に何回でも出し直せる。3、正解率で順位がつき、順位は毎日入れ替わる。登録者は2900万人を超え、2025年には68本のコンペが開かれた。提出を重ねるほど正解率は上がるが、満点はなく頭打ちに近づく。">
<!--
  ★スマホ用の縦版（図1 fig-kaggle）。パソコン用は fig-kaggle.svg（横長 760×520）
  ★viewBox 306 ＝ 画面375pxで図が出る実寸。最小14px。使える幅は x=14〜292 の278px
  ★★丸数字（①②③）をやめて 1 2 3 にした（→ 105 §8-8 ⑪。図7・図4と同じ）
    ★横長版には ①②③ が残っている
  ★この版 ── 表を間引く:いいえ ／ 順位表をHTMLへ出す:いいえ
  ★tools/gen_fig_kaggle_sp.py が生成している。手で直さず、生成器を直すこと
-->
<style>
