<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 306 530" role="img"
     aria-label="The division of labor in creation. Step 1, the human sets the direction: which kind of new is worth aiming at. Step 2, the AI produces non-obvious links fast and in bulk. Step 3, the human judges, testing with counterexamples whether a candidate is genuine or contrived.">
<!--
  ★スマホ用の縦版（図7 fig07）。パソコン用は fig07.svg（横長 760×414）をそのまま使う
  ★viewBox 306 ＝ 画面375pxで図が出る実寸。書いた数字がそのまま見える大きさになる
  ★最小14px（図5で確定した基準）
  ★横に並んでいた3つの列（01 方向／02 候補／03 判定）を縦に積んだ。
    上の罫線で区切る作りは元の図のまま（箱と矢印を使わない設計を保っている）
  ★色 ── 人間＝緑の罫線／AI＝灰の罫線（元の図と同じ）
  ★説明の2行の折り返しは元の図と同じ位置に保った。3つが同じ形に並ぶことが
    この図の主題（役割の対比）なので、1行にまとめると横並びが崩れる
  ★★足元の註「候補はほとんど外れ。01と03は、人間しかできない」は削除した
    （2026-09-06 山田様「意味不明だから消せ」）。★横長版からも消した
  ★★番号は 01/02/03 → 1/2/3 にした（2026-09-06 山田様の指示。★横長版も同じ）
-->
<style>
text{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;font-weight:400;fill:#333}
.eyebrow{font-size:14px;font-weight:600;fill:#7d7d7d}
.deck{font-size:22px;font-weight:600;fill:#111}
.who{font-size:14px;font-weight:600}
.label{font-size:20px;font-weight:600;fill:#111}
.body{font-size:16px}
</style>

<rect width="306" height="530" fill="#fff"/>

<text class="eyebrow" x="14" y="22">Division of labor in creation</text>

<text class="deck" x="14" y="58">All the AI produces</text>
<text class="deck" x="14" y="86">is candidates. Aim and</text>
<text class="deck" x="14" y="114">judgment sit with humans</text>

<!-- ============ 01 方向（人間） ============ -->
<line x1="14" y1="150" x2="292" y2="150" stroke="#019949" stroke-width="3"/>
<text class="who"   x="14" y="172" fill="#019949">Human</text>
<text class="label" x="14" y="200">1 Direction</text>
<text class="body"  x="14" y="228">Which kind of new</text>
<text class="body"  x="14" y="252">is worth aiming at</text>

<!-- ============ 02 候補（AI） ============ -->
<line x1="14" y1="278" x2="292" y2="278" stroke="#c4c4c4" stroke-width="3"/>
<text class="who"   x="14" y="300" fill="#7d7d7d">AI</text>
<text class="label" x="14" y="328">2 Candidates</text>
<text class="body"  x="14" y="356">Produce non-obvious</text>
<text class="body"  x="14" y="380">links fast and in bulk</text>

<!-- ============ 03 判定（人間） ============ -->
<line x1="14" y1="406" x2="292" y2="406" stroke="#019949" stroke-width="3"/>
<text class="who"   x="14" y="428" fill="#019949">Human</text>
<text class="label" x="14" y="456">3 Judgment</text>
<text class="body"  x="14" y="484">Genuine or contrived ──</text>
<text class="body"  x="14" y="508">test with counterexamples</text>

</svg>
